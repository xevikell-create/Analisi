name: Deploy Patrimonio V2 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare static Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -f index.html ./*.js ./*.json ./*.webmanifest ./*.svg dist/
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/market.js
          test -f dist/patrimony-evolution-v2.js
          test -f dist/radar-data.json
          test -f dist/manifest.json
          test -f dist/sw.js
          echo "Static app and all runtime assets are ready for Pages."
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
