name: Deploy Patrimonio V2 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Include runtime assets in Pages artifact
        run: |
          set -euo pipefail
          test -d dist
          cp -f ./*.js ./*.json ./*.webmanifest ./*.svg dist/
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/market.js
          test -f dist/patrimony-evolution-v2.js
          test -f dist/radar-data.json
          echo "Runtime JS, JSON, manifests and icons copied into Pages artifact."
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
