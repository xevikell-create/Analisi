name: Fix aportaciones
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-aportaciones.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix loader timing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text()
          old="function installContributions(){if(typeof pages==='undefined')return;pages.aportaciones="
          new="function installContributions(){if(typeof pages==='undefined'){setTimeout(installContributions,50);return;}pages.aportaciones="
          if old not in s:
              raise SystemExit('pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market.js
          git diff --cached --quiet || git commit -m 'Fix aportaciones page initialization'
          git push
