name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch market quotes, FX and Ethereum
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          with open('market-symbols.json', encoding='utf-8') as f:
              registry = json.load(f)['assets']
          symbols = {name: symbol for name, symbol in registry.items() if symbol}
          out = {'provider': 'fallback', 'updatedAt': datetime.now(timezone.utc).isoformat(), 'quotes': {}, 'fxRates': {}, 'crypto': {}}

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 PatrimonioV2/1.1'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def normalize_quote(price, currency):
              raw = str(currency or 'EUR').upper()
              if raw in ('GBP','GBPENCE','GBX'):
                  p = float(price)
                  if raw in ('GBX','GBPENCE') or p > 1000:
                      return p / 100.0, 'GBP'
                  return p, 'GBP'
              return float(price), raw

          key = os.environ.get('TWELVE_DATA_API_KEY', '')
          if key and symbols:
              try:
                  params = urllib.parse.urlencode({'symbol': ','.join(symbols.values()), 'apikey': key, 'interval': '1min'})
                  payload = get_json('https://api.twelvedata.com/quote?' + params)
                  for name, symbol in symbols.items():
                      q = payload.get(symbol, {}) if isinstance(payload, dict) else {}
                      if isinstance(q, dict) and q.get('close'):
                          price, currency = normalize_quote(q['close'], q.get('currency'))
                          out['quotes'][name] = {'symbol': symbol, 'price': price, 'currency': currency, 'change': float(q.get('change') or 0), 'percentChange': float(q.get('percent_change') or 0), 'timestamp': q.get('timestamp'), 'source': 'Twelve Data'}
                  if out['quotes']:
                      out['provider'] = 'twelvedata'
              except Exception as e:
                  out['primaryError'] = str(e)

          missing = [(name, symbol) for name, symbol in symbols.items() if name not in out['quotes']]
          for name, symbol in missing:
              for host in ('query1.finance.yahoo.com', 'query2.finance.yahoo.com'):
                  if name in out['quotes']:
                      break
                  try:
                      url = 'https://' + host + '/v8/finance/chart/' + urllib.parse.quote(symbol, safe='') + '?range=1d&interval=1m'
                      payload = get_json(url)
                      result = (payload.get('chart') or {}).get('result') or []
                      meta = result[0].get('meta', {}) if result else {}
                      price = meta.get('regularMarketPrice')
                      if price is None and result:
                          closes = ((result[0].get('indicators') or {}).get('quote') or [{}])[0].get('close') or []
                          vals = [x for x in closes if isinstance(x, (int, float))]
                          price = vals[-1] if vals else None
                      if price is not None:
                          price, currency = normalize_quote(price, meta.get('currency'))
                          out['quotes'][name] = {'symbol': symbol, 'price': price, 'currency': currency, 'change': 0, 'percentChange': 0, 'timestamp': datetime.now(timezone.utc).isoformat(), 'source': 'Yahoo Finance'}
                  except Exception:
                      pass

          # Last-resort quote continuity: use the fresh Radar market snapshot when a symbol
          # is temporarily rate-limited by the quote provider. This prevents a live position
          # from disappearing from the portfolio merely because one provider returned 429/403.
          try:
              radar = json.load(open('radar-data.json', encoding='utf-8')).get('assets', {})
              for name, symbol in symbols.items():
                  if name not in out['quotes']:
                      a = next((x for x in radar.values() if x.get('ticker') == symbol and x.get('price') is not None), None)
                      if a:
                          out['quotes'][name] = {'symbol': symbol, 'price': float(a['price']), 'currency': a.get('currency','USD'), 'change': 0, 'percentChange': 0, 'timestamp': a.get('updatedAt') or datetime.now(timezone.utc).isoformat(), 'source': 'Radar market snapshot'}
          except Exception as e:
              out['fallbackError'] = str(e)

          for base, key_name in [('USD','USD_EUR'),('HKD','HKD_EUR'),('JPY','JPY_EUR'),('GBP','GBP_EUR')]:
              try:
                  payload = get_json(f'https://api.frankfurter.app/latest?from={base}&to=EUR')
                  rate = payload.get('rates', {}).get('EUR')
                  if rate is not None:
                      out['fxRates'][key_name] = float(rate)
              except Exception:
                  pass

          try:
              payload = get_json('https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=eur')
              price = payload.get('ethereum', {}).get('eur')
              if price is not None:
                  out['crypto']['ETH_EUR'] = float(price)
          except Exception:
              pass

          if len(out['quotes']) < len(symbols):
              out['error'] = f"Only {len(out['quotes'])}/{len(symbols)} quotes available"
          elif out['provider'] == 'fallback':
              out['provider'] = 'yahoo'

          with open('market-data.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f"Saved {len(out['quotes'])}/{len(symbols)} quotes; FX={out['fxRates']}; ETH={out['crypto'].get('ETH_EUR')}")
          PY

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          git diff --cached --quiet || git commit -m "chore(v4): refresh market data"
          git push
