name: Refresh V4 market data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Twelve Data quotes
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          path = 'market-symbols.json'
          symbols = json.load(open(path, encoding='utf-8'))['assets']
          api_key = os.environ.get('TWELVE_DATA_API_KEY', '').strip()
          quotes = {}
          errors = {}

          if api_key:
              for name, symbol in symbols.items():
                  if not symbol:
                      continue
                  url = 'https://api.twelvedata.com/quote?' + urllib.parse.urlencode({'symbol': symbol, 'apikey': api_key})
                  try:
                      with urllib.request.urlopen(url, timeout=15) as response:
                          payload = json.load(response)
                      price = payload.get('close') or payload.get('price')
                      if price is not None:
                          quotes[name] = {
                              'symbol': symbol,
                              'price': float(price),
                              'currency': payload.get('currency'),
                              'timestamp': payload.get('datetime')
                          }
                      else:
                          errors[name] = payload.get('message', 'No price returned')
                  except Exception as exc:
                      errors[name] = str(exc)
                  time.sleep(1)
          else:
              errors['_config'] = 'TWELVE_DATA_API_KEY is not configured'

          output = {
              'provider': 'twelvedata',
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'quotes': quotes,
              'errors': errors,
              'note': 'Stock/ETF quotes refreshed by GitHub Actions. ETH/EUR is fetched live in the app from CoinGecko.'
          }
          json.dump(output, open('market-data.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json
          git diff --cached --quiet || git commit -m 'chore(v4): refresh market data'
          git push
