name: Publish security layer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject security gate into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="security.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Security gate injected')
          else:
              print('Security gate already present')

      - name: Commit protected app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html security.js
          git diff --cached --quiet || git commit -m "security: protect Patrimonio V2 with authentication"
          git push
