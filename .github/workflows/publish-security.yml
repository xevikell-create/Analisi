name: Publish security layer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app files
        run: |
          test -f index.html
          test -f security.js
          echo "App validated; no automatic file mutation or commit."
