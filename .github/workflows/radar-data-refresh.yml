name: Radar data refresh
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh market snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          p=Path('radar-data.json')
          data=json.loads(p.read_text()) if p.exists() else {'version':1,'assets':{}}
          symbols={a.get('ticker'):a for a in data.get('assets',{}).values() if a.get('ticker')}
          for symbol,a in symbols.items():
              try:
                  url=f'https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(symbol,safe="")}?range=5d&interval=1d'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r: j=json.load(r)
                  res=j['chart']['result'][0]; meta=res.get('meta',{})
                  a['price']=meta.get('regularMarketPrice'); a['currency']=meta.get('currency') or a.get('currency'); a['updatedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()); a['sources']=[{'type':'market','name':'Yahoo Finance'}]
              except Exception as e:
                  a['refreshError']=str(e)
          data['updatedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()); p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-data.json
          git diff --cached --quiet || git commit -m 'chore: refresh Radar market data'
          git push
