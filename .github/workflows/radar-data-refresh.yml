name: Radar data refresh
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install universe expansion dependency
        run: python -m pip install --disable-pip-version-check pandas lxml
      - name: Expand global Radar universe
        run: python scripts/expand_radar_universe.py
      - name: Refresh Radar market snapshot
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          from pathlib import Path
          data_path=Path('radar-data.json')
          universe_path=Path('radar-universe-v2.json')
          data=json.loads(data_path.read_text()) if data_path.exists() else {'version':3,'assets':{}}
          universe=json.loads(universe_path.read_text()) if universe_path.exists() else {'assets':[]}
          assets=data.setdefault('assets',{})
          for seed in universe.get('assets',[]):
              key=seed.get('ticker') or seed.get('marketTicker')
              if not key: continue
              existing=assets.get(key,{})
              merged={**seed,**existing}
              for k in ('name','ticker','marketTicker','assetType','sector','country','theme','universeSource','universeTier'):
                  if seed.get(k) is not None: merged[k]=seed[k]
              assets[key]=merged
          ok=0
          for key,a in assets.items():
              symbol=a.get('marketTicker') or a.get('ticker')
              if not symbol: continue
              try:
                  url=f'https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(symbol,safe="")}?range=5d&interval=1d'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r: j=json.load(r)
                  res=j['chart']['result'][0]; meta=res.get('meta',{})
                  price=meta.get('regularMarketPrice')
                  if price is not None:
                      a['price']=price; ok+=1
                  a['currency']=meta.get('currency') or a.get('currency')
                  a['marketUpdatedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
                  a['marketSource']='Yahoo Finance'
                  a.pop('refreshError',None)
              except Exception as e:
                  a['refreshError']=str(e)
          data['version']=5
          data['universe']='radar-universe-v2.json'
          data['coverage']=universe.get('coverage',{})
          data['coverage']['pricedAssets']=ok
          data['coverage']['assetCount']=len(assets)
          data['updatedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print(f'Radar universe: {len(assets)} assets; prices: {ok}')
          PY
      - name: Refresh US fundamentals from SEC XBRL
        run: python scripts/refresh_sec_fundamentals.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-data.json radar-universe-v2.json
          git diff --cached --quiet || git commit -m 'chore: dynamically expand Radar global universe and refresh data'
          git push
