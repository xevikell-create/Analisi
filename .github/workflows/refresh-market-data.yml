name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          ref: feature/patrimonio-v2-completa
      - name: Refresh quotes from Twelve Data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          key=os.environ.get('TWELVE_DATA_API_KEY','').strip()
          if not key: raise SystemExit('TWELVE_DATA_API_KEY is not configured')
          symbols=json.load(open('market-symbols.json',encoding='utf-8'))['assets']
          quotes={}; errors={}
          for name,symbol in symbols.items():
            if not symbol: continue
            try:
              url='https://api.twelvedata.com/quote?'+urllib.parse.urlencode({'symbol':symbol,'apikey':key})
              with urllib.request.urlopen(url,timeout=20) as r: j=json.load(r)
              price=j.get('close') or j.get('price')
              if price is not None:
                quotes[name]={'symbol':symbol,'price':float(price),'currency':j.get('currency'),'timestamp':j.get('datetime')}
              else: errors[name]=j.get('message','No price returned')
            except Exception as e: errors[name]=str(e)
            time.sleep(1)
          out={'provider':'twelvedata','updatedAt':datetime.now(timezone.utc).isoformat(),'quotes':quotes,'errors':errors}
          json.dump(out,open('market-data.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(f'Updated {len(quotes)} quotes; {len(errors)} errors')
          PY
      - name: Commit and push data to V4 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json
          git diff --cached --quiet || git commit -m 'chore: refresh live market prices'
          git push origin HEAD:feature/patrimonio-v2-completa
