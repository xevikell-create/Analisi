name: Refresh V4 market data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: feature/patrimonio-v2-completa

      - name: Fetch Twelve Data quotes
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          symbols = json.load(open('market-symbols.json', encoding='utf-8'))['assets']
          key = os.environ.get('TWELVE_DATA_API_KEY','').strip()
          quotes, errors = {}, {}
          if not key:
              raise SystemExit('TWELVE_DATA_API_KEY is not configured')
          for name, symbol in symbols.items():
              if not symbol: continue
              try:
                  url='https://api.twelvedata.com/quote?'+urllib.parse.urlencode({'symbol':symbol,'apikey':key})
                  with urllib.request.urlopen(url, timeout=20) as r: payload=json.load(r)
                  price=payload.get('close') or payload.get('price')
                  if price is not None:
                      quotes[name]={'symbol':symbol,'price':float(price),'currency':payload.get('currency'),'timestamp':payload.get('datetime')}
                  else: errors[name]=payload.get('message','No price returned')
              except Exception as e: errors[name]=str(e)
              time.sleep(1)
          json.dump({'provider':'twelvedata','updatedAt':datetime.now(timezone.utc).isoformat(),'quotes':quotes,'errors':errors,'note':'Stock/ETF quotes refreshed by GitHub Actions. ETH/EUR is fetched live in the app from CoinGecko.'},open('market-data.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(f'Updated {len(quotes)} quotes; {len(errors)} errors')
          PY

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json
          git diff --cached --quiet || git commit -m 'chore(v4): refresh market data'
          git push origin HEAD:feature/patrimonio-v2-completa
