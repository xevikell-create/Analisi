name: Validate Patrimonio V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js market.js market-data.json manifest.json market-symbols.json security.js final-audit.js security-settings.js pl-chart.js pl-fix.js; do test -f "$f"; done
          grep -q "Patrimonio V2" index.html
          grep -q "MarketV4" market.js
          grep -q "Ethereum" market.js
          grep -q "¿Dónde pongo el próximo euro?" app.js
          grep -q "final-audit.js" index.html
          echo "Required files and final modules present."
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js market.js security.js security-settings.js security-settings-fix.js security-nav.js pl-fix.js pl-chart.js final-audit.js toyota-fix.js; do node --check "$f"; done
      - name: Validate JSON data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for p in ['market-data.json','manifest.json','market-symbols.json','portfolio-data.json']:
              with open(p,encoding='utf-8') as f: json.load(f)
              print(p, 'OK')
          PY
      - name: Validate complete market snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          symbols=json.load(open('market-symbols.json',encoding='utf-8'))['assets']
          market=json.load(open('market-data.json',encoding='utf-8'))
          quotes=market.get('quotes',{})
          missing=[name for name in symbols if name not in quotes]
          if missing:
              raise SystemExit('Missing market quotes: '+', '.join(missing))
          for key in ('USD_EUR','HKD_EUR','JPY_EUR','GBP_EUR'):
              if not market.get('fxRates',{}).get(key): raise SystemExit('Missing FX rate: '+key)
          if not market.get('crypto',{}).get('ETH_EUR'): raise SystemExit('Missing ETH/EUR price')
          print(f"Market snapshot complete: {len(quotes)}/{len(symbols)} quotes; FX=4; ETH=OK")
          PY
      - name: Validate final calculation features
        shell: bash
        run: |
          set -euo pipefail
          grep -q "totalCost" final-audit.js
          grep -q "totalValue" final-audit.js
          grep -q "Ethereum" final-audit.js
          grep -q "patrimonio_crypto_cost_eur" final-audit.js
          grep -q "lockOnBackground" security.js
          ! grep -q "TIMEOUT=30000" security.js
          echo "Final P/L, chart, ETH cost basis and security timeout checks passed."
      - name: Validate portfolio engine and contribution logic
        shell: bash
        run: |
          set -euo pipefail
          grep -q "newAvg" app.js
          grep -q "patrimonio_positions_overrides" app.js
          grep -q "finalContribution" final-audit.js
          echo "Portfolio engine and average-cost contribution logic detected."
