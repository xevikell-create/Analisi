name: Validate Patrimonio V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f market.js
          test -f market-data.json
          test -f manifest.json
          test -f market-symbols.json
          test -f security.js
          grep -q "Patrimonio V2" index.html
          grep -q "PortfolioIntelligenceV4" market.js
          grep -q "MarketV4" market.js
          grep -q "Ethereum" market.js
          grep -q "¿Dónde pongo el próximo euro?" app.js
          echo "Required files and core modules present."
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check market.js
          node --check security.js
      - name: Validate JSON data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for p in ['market-data.json','manifest.json','market-symbols.json']:
              with open(p,encoding='utf-8') as f: json.load(f)
              print(p, 'OK')
          PY
      - name: Validate complete market snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          symbols=json.load(open('market-symbols.json',encoding='utf-8'))['assets']
          market=json.load(open('market-data.json',encoding='utf-8'))
          quotes=market.get('quotes',{})
          missing=[name for name in symbols if name not in quotes]
          if missing:
              raise SystemExit('Missing market quotes: '+', '.join(missing))
          for key in ('USD_EUR','HKD_EUR','JPY_EUR','GBP_EUR'):
              if not market.get('fxRates',{}).get(key):
                  raise SystemExit('Missing FX rate: '+key)
          if not market.get('crypto',{}).get('ETH_EUR'):
              raise SystemExit('Missing ETH/EUR price')
          print(f"Market snapshot complete: {len(quotes)}/{len(symbols)} quotes; FX=4; ETH=OK")
          PY
      - name: Validate market quality states
        shell: bash
        run: |
          set -euo pipefail
          grep -Riq "429\|fallback\|cache\|stale" market.js market-data.json app.js
          echo "Market fallback/stale handling markers present."
      - name: Validate portfolio engine and contribution logic
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PortfolioIntelligenceV4" market.js
          grep -q "newAvg" app.js
          grep -q "patrimonio_positions_overrides" app.js
          echo "Portfolio engine and average-cost contribution logic detected."
