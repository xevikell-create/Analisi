<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Patrimonio V2</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#1f6feb;--green:#159957;--red:#d64545;--border:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:30px}header{background:var(--dark);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.7}nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:67px;z-index:4}nav button{border:0;background:#eef2f7;padding:10px 14px;border-radius:10px;white-space:nowrap;font-weight:600}nav button.active{background:var(--accent);color:#fff}main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.kpi{font-size:25px;font-weight:750;margin-top:7px}.muted{color:var(--muted);font-size:13px}.section{margin:20px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.row:last-child{border-bottom:0}button.action{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:650}button.danger{background:#fff;color:var(--red);border:1px solid #f0caca}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:600}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.hero .muted{color:#cbd5e1}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);border-radius:99px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);font-size:14px}.right{text-align:right}.chart{width:100%;height:230px;background:#fafafa;border-radius:12px;border:1px solid var(--border)}.chart svg{width:100%;height:100%}.chart polyline{fill:none;stroke:var(--accent);stroke-width:3}.chart .dot{fill:var(--accent)}.empty{padding:25px;text-align:center;color:var(--muted)}</style></head><body><header><h1>Patrimonio V2</h1><small>Centro de control patrimonial · Objetivo: máximo patrimonio</small></header><nav id="nav"></nav><main id="app"></main><script>
const KEY='patrimonio_v2';const base={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:[['First Solar',2300],['BYD',1800],['Netflix',1800],['Meta',1900],['Apple',1400],['Palantir',1400],['Toyota',1300],['AMD',1800],['Nvidia',1700],['CaixaBank',1100],['S&P 500 ETF',600],['Amazon',598],['NextEra Energy',520],['MSCI World Acc',0]],decisions:[],history:[],contributions:[]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(base);data.history=data.history||[];data.contributions=data.contributions||[];function save(){localStorage.setItem(KEY,JSON.stringify(data))}function inv(){return data.assets.reduce((s,x)=>s+Number(x[1]||0),0)}function crypto(){return Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}function total(){return inv()+data.accounts.remunerada+data.accounts.efectivo+crypto()}function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n)}function pct(n){return (n*100).toFixed(1)+'%'}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function setPage(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({dashboard,cartera,liquidez,objetivo,decisiones,ajustes,historial}[p])(document.getElementById('app'))}
function dashboard(a){let t=total(),l=data.accounts.remunerada+data.accounts.efectivo,p=Math.min(100,t/data.target*100);a.innerHTML=`<div class="section"><div class="card hero"><span class="badge">CONTROL PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><p class="muted">Objetivo ${money(data.target)} · ${pct(t/data.target)} alcanzado</p><div class="progress"><div style="width:${p}%"></div></div></div></div><div class="grid"><div class="card"><div class="muted">Invertido</div><div class="kpi">${money(inv())}</div></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(l)}</div></div><div class="card"><div class="muted">Crypto</div><div class="kpi">${data.crypto.eth} ETH${data.crypto.ethPrice?' · '+money(crypto()):''}</div></div><div class="card"><div class="muted">Aportación semanal</div><div class="kpi">${money(data.weekly)}</div></div></div><div class="section card"><h3>Evolución del patrimonio</h3>${chart()}</div><div class="section grid"><div class="card"><h3>¿Dónde pongo el próximo euro?</h3><p><b>MSCI World Acc</b></p><p class="muted">Mantener ${money(data.weekly)}/semana como núcleo.</p></div><div class="card"><h3>Última aportación</h3><p>${data.contributions.length?money(data.contributions[0].amount)+' · '+esc(data.contributions[0].asset):'Todavía no registrada'}</p><p class="muted">Consulta Historial para ver toda la evolución.</p></div></div>`}
function chart(){let h=[...data.history].sort((a,b)=>a.date.localeCompare(b.date));if(!h.length)return '<div class="empty">Registra tu primer cierre patrimonial en Historial y la gráfica empezará a crecer.</div>';let vals=h.map(x=>Number(x.value)),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,w=700,hgt=210;let pts=vals.map((v,i)=>{let x=20+(i*(w-40)/Math.max(1,vals.length-1));let y=190-(v-min)/range*160;return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');return `<div class="chart"><svg viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none"><polyline points="${pts}"/>${vals.map((v,i)=>{let x=20+(i*(w-40)/Math.max(1,vals.length-1));let y=190-(v-min)/range*160;return `<circle class="dot" cx="${x}" cy="${y}" r="4"/>`}).join('')}</svg></div><div class="row"><span>${h[0].date}</span><b>${money(vals[vals.length-1])}</b></div>`}
function cartera(a){a.innerHTML=`<div class="section"><h2>Cartera completa</h2><div class="card"><table><tr><th>Activo</th><th class="right">Valor</th><th class="right">Peso</th></tr>${data.assets.map(x=>`<tr><td>${esc(x[0])}</td><td class="right">${money(x[1])}</td><td class="right">${pct(Number(x[1])/Math.max(1,inv()))}</td></tr>`).join('')}</table></div><div class="card section"><h3>Añadir / actualizar activo</h3><div class="form"><div><label>Nombre</label><input id="aname"></div><div><label>Valor (€)</label><input id="avalue" type="number"></div></div><br><button class="action" onclick="upsert()">Guardar</button></div></div>`}function upsert(){let n=aname.value.trim(),v=Number(avalue.value);if(!n||!Number.isFinite(v))return;let f=data.assets.find(x=>x[0].toLowerCase()===n.toLowerCase());f?f[1]=v:data.assets.push([n,v]);save();setPage('cartera')}
function liquidez(a){a.innerHTML=`<div class="section"><h2>Liquidez</h2><div class="grid"><div class="card"><div class="muted">Cuenta remunerada</div><div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card"><div class="muted">Efectivo</div><div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card"><div class="muted">Total</div><div class="kpi">${money(data.accounts.remunerada+data.accounts.efectivo)}</div></div></div></div>`}
function objetivo(a){let t=total(),gap=Math.max(0,data.target-t),annual=data.weekly*52;a.innerHTML=`<div class="section"><h2>Objetivo 1 M€</h2><div class="card hero"><div class="kpi">${pct(t/data.target)}</div><p>${money(gap)} para alcanzar el objetivo.</p></div><div class="grid section"><div class="card"><div class="muted">Aportación anual</div><div class="kpi">${money(annual)}</div></div><div class="card"><div class="muted">Rentabilidad estimada</div><div class="kpi">${data.returnRate}%</div></div></div></div>`}
function decisiones(a){a.innerHTML=`<div class="section"><h2>Decisiones</h2><div class="card"><div class="form"><div><label>Activo</label><input id="dasset"></div><div><label>Decisión</label><select id="dtype"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div></div><br><button class="action" onclick="addDecision()">Guardar</button></div><div class="card section">${data.decisions.length?data.decisions.map(d=>`<div class="row"><span><b>${esc(d.asset)}</b><br><span class="muted">${d.date}</span></span><span class="badge">${d.type}</span></div>`).join(''):'Sin decisiones.'}</div></div>`}function addDecision(){let x=dasset.value.trim();if(!x)return;data.decisions.unshift({asset:x,type:dtype.value,date:new Date().toLocaleDateString('es-ES')});save();setPage('decisiones')}
function historial(a){a.innerHTML=`<div class="section"><h2>Evolución y aportaciones</h2><div class="card"><h3>Registrar cierre patrimonial</h3><p class="muted">Introduce el patrimonio total que tienes ese día. Esto crea un punto en la gráfica.</p><div class="form"><div><label>Fecha</label><input id="hdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Patrimonio total (€)</label><input id="hvalue" type="number" value="${Math.round(total())}"></div></div><br><button class="action" onclick="addHistory()">Guardar evolución</button></div><div class="card section"><h3>Registrar aportación</h3><div class="form"><div><label>Fecha</label><input id="cdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Importe (€)</label><input id="camount" type="number" value="${data.weekly}"></div><div><label>Destino</label><input id="casset" value="MSCI World Acc"></div></div><br><button class="action" onclick="addContribution()">Guardar aportación</button></div><div class="card section"><h3>Histórico</h3>${data.history.length?[...data.history].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><span>${x.date}</span><b>${money(x.value)}</b></div>`).join(''):'Sin puntos registrados.'}</div><div class="card section"><h3>Aportaciones acumuladas</h3><div class="kpi">${money(data.contributions.reduce((s,x)=>s+Number(x.amount),0))}</div>${data.contributions.length?[...data.contributions].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><span>${x.date}<br><span class="muted">${esc(x.asset)}</span></span><b>${money(x.amount)}</b></div>`).join(''):'Sin aportaciones registradas.'}</div></div>`}
function addHistory(){let d=hdate.value,v=Number(hvalue.value);if(!d||!Number.isFinite(v))return;let f=data.history.find(x=>x.date===d);f?f.value=v:data.history.push({date:d,value:v});save();setPage('historial')}function addContribution(){let d=cdate.value,v=Number(camount.value),asset=casset.value.trim()||'MSCI World Acc';if(!d||!Number.isFinite(v))return;data.contributions.unshift({date:d,amount:v,asset});save();setPage('historial')}
function ajustes(a){a.innerHTML=`<div class="section"><h2>Ajustes</h2><div class="card"><div class="form"><div><label>Cuenta remunerada</label><input id="rem" type="number" value="${data.accounts.remunerada}"></div><div><label>Efectivo</label><input id="cash" type="number" value="${data.accounts.efectivo}"></div><div><label>ETH</label><input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div><div><label>Precio ETH</label><input id="ethprice" type="number" value="${data.crypto.ethPrice}"></div><div><label>Aportación semanal</label><input id="weekly" type="number" value="${data.weekly}"></div><div><label>Objetivo</label><input id="target" type="number" value="${data.target}"></div><div><label>Rentabilidad estimada %</label><input id="rate" type="number" step=".1" value="${data.returnRate}"></div></div><br><button class="action" onclick="updateSettings()">Guardar</button></div></div>`}function updateSettings(){data.accounts.remunerada=+rem.value;data.accounts.efectivo=+cash.value;data.crypto.eth=+eth.value;data.crypto.ethPrice=+ethprice.value;data.weekly=+weekly.value;data.target=+target.value;data.returnRate=+rate.value;save();setPage('dashboard')}
const pages=[['dashboard','Dashboard'],['cartera','Cartera'],['liquidez','Liquidez'],['objetivo','Objetivo 1 M€'],['historial','Evolución'],['decisiones','Decisiones'],['ajustes','Ajustes']];nav.innerHTML=pages.map(([p,n])=>`<button data-p="${p}" onclick="setPage('${p}')">${n}</button>`).join('');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});setPage('dashboard');</script></body></html>
