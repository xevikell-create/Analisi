<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Patrimonio V4</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--blue:#2563eb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:23px}header small{opacity:.7}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;position:sticky;top:67px;z-index:4;border-bottom:1px solid var(--border)}nav button{border:0;padding:10px 13px;border-radius:10px;font-weight:650;white-space:nowrap}nav button.active{background:var(--blue);color:#fff}main{max-width:1150px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.kpi{font-size:25px;font-weight:800;margin:5px 0}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#cbd5e1}.section{margin:16px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:11px 0}.row:last-child{border:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:700}.green{background:#e9f8ef;color:#167347}.red{background:#fdecec;color:#b52c2c}.amber{background:#fff7df;color:#8a5a00}.action{border:0;background:var(--blue);color:#fff;padding:10px 13px;border-radius:10px;font-weight:700}.danger{background:#fff;color:var(--red);border:1px solid #f0caca}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.progress,.bar{height:10px;background:#e9edf1;border-radius:99px;overflow:hidden}.progress>div,.bar>div{height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:14px}.right{text-align:right}.small{font-size:12px}.notice{padding:12px;background:#f7f9fc;border:1px solid var(--border);border-radius:12px}.delete{border:0;background:transparent;color:var(--red);font-weight:700}</style></head><body><header><h1>Patrimonio V4</h1><small>Centro de control patrimonial · Objetivo máximo patrimonio</small></header><nav id="nav"></nav><main id="app"></main><script src="market.js"></script><script>
const KEY='patrimonio_v4';const seed=[["First Solar",2300,"Acción"],["BYD",1800,"Acción"],["Netflix",1800,"Acción"],["Meta",1900,"Acción"],["Apple",1400,"Acción"],["Palantir",1400,"Acción"],["Toyota",1300,"Acción"],["AMD",1800,"Acción"],["Nvidia",1700,"Acción"],["CaixaBank",1100,"Acción"],["S&P 500 ETF",600,"ETF"],["Amazon",598,"Acción"],["NextEra Energy",520,"Acción"],["MSCI World Acc",0,"ETF"]];const initial={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:seed,decisions:[],contributions:[],radar:[],alerts:[],market:{provider:'coingecko+twelvedata',apiKey:'',lastSync:null}};window.data=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}})();let data=window.data;data.assets=data.assets||seed;data.decisions=data.decisions||[];data.contributions=data.contributions||[];data.radar=data.radar||[];data.alerts=data.alerts||[];data.market=data.market||initial.market;function save(){window.data=data;localStorage.setItem(KEY,JSON.stringify(data))}function assets(){return data.assets}function inv(){return assets().reduce((s,x)=>s+Number(x[1]||0),0)}function liq(){return +data.accounts.remunerada+(+data.accounts.efectivo)}function crypto(){return +data.crypto.eth*(+data.crypto.ethPrice||0)}function total(){return inv()+liq()+crypto()}function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0)}function pct(n){return ((n||0)*100).toFixed(1)+'%'}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function find(n){return assets().find(x=>x[0].toLowerCase()===n.toLowerCase())}function decision(){let t=total(),l=liq(),core=find('MSCI World Acc'),cv=core?+core[1]:0;if(!t)return ['EMPEZAR','amber','Introduce los datos patrimoniales.'];if(l/t>.65)return ['ACUMULAR','green','Hay mucha liquidez: priorizar inversión escalonada manteniendo el colchón.'];if(cv/Math.max(1,inv())<.3)return ['REFORZAR NÚCLEO','green','El MSCI World todavía pesa poco: el próximo euro debe ir principalmente al núcleo global.'];return ['MANTENER','green','Continuar aportación periódica y esperar oportunidades con margen suficiente.']}function nav(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));pages[p](document.getElementById('app'))}
const pages={dashboard(a){let t=total(),d=decision(),gap=Math.max(0,data.target-t);a.innerHTML=`<div class="card hero"><span class="badge">V4 · MOTOR PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><p class="muted">${pct(t/data.target)} del objetivo de ${money(data.target)}</p><div class="progress"><div style="width:${Math.min(100,t/data.target*100)}%"></div></div><p class="small">Faltan ${money(gap)}</p></div><div class="grid section"><div class="card"><span class="muted">Invertido</span><div class="kpi">${money(inv())}</div><span class="small">${pct(inv()/Math.max(1,t))}</span></div><div class="card"><span class="muted">Liquidez</span><div class="kpi">${money(liq())}</div><span class="small">${pct(liq()/Math.max(1,t))}</span></div><div class="card"><span class="muted">ETH</span><div class="kpi">${data.crypto.eth} ETH</div><span class="small">${data.crypto.ethPrice?money(crypto()):'Precio pendiente'}</span></div><div class="card"><span class="muted">Aportación semanal</span><div class="kpi">${money(data.weekly)}</div><span class="small">${money(data.weekly*52)}/año</span></div></div><div class="two section"><div class="card"><h3>¿Dónde pongo el próximo euro?</h3><span class="badge ${d[1]}">${d[0]}</span><p>${d[2]}</p><button class="action" onclick="aporte()">Registrar ${money(data.weekly)}</button></div><div class="card"><h3>Mercado</h3><p class="muted">Última sincronización</p><b>${data.market.lastSync||'Aún no sincronizado'}</b><br><br><button class="action" onclick="syncMarket()">Actualizar precios</button></div></div><div class="card"><h3>Asignación</h3>${allocation()}</div>`},cartera(a){a.innerHTML=`<h2>Cartera</h2><div class="card"><table><thead><tr><th>Activo</th><th>Tipo</th><th class="right">Valor</th><th class="right">Peso</th></tr></thead><tbody>${assets().map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[2]||'Activo')}</td><td class="right">${money(x[1])}</td><td class="right">${pct(+x[1]/Math.max(1,inv()))}</td></tr>`).join('')}</tbody></table></div><div class="card section"><h3>Actualizar posición</h3><div class="form"><div>Activo<input id="an" placeholder="Nvidia"></div><div>Valor (€)<input id="av" type="number"></div><div>Tipo<select id="at"><option>Acción</option><option>ETF</option><option>Fondo</option><option>Otro</option></select></div></div><br><button class="action" onclick="assetSave()">Guardar</button></div>`},liquidez(a){a.innerHTML=`<h2>Liquidez</h2><div class="grid"><div class="card">Cuenta remunerada<div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card">Efectivo<div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card">Total<div class="kpi">${money(liq())}</div></div></div><div class="card section"><h3>Colchón y asignación</h3><p>Liquidez sobre patrimonio: <b>${pct(liq()/Math.max(1,total()))}</b></p><p class="muted">La V4 separa seguridad, liquidez e inversión para que el motor no confunda efectivo con rentabilidad.</p></div>`},objetivo(a){let t=total(),annual=data.weekly*52;function years(r){let v=t,y=0;while(v<data.target&&y<70){v=v*(1+r)+annual;y++}return y<70?y+ ' años':'>70 años'}a.innerHTML=`<h2>Objetivo 1 M€</h2><div class="card hero"><div class="kpi">${pct(t/data.target)}</div><p>Faltan ${money(Math.max(0,data.target-t))}</p></div><div class="grid section"><div class="card">Aportación anual<div class="kpi">${money(annual)}</div></div><div class="card">Rentabilidad base<div class="kpi">${data.returnRate}%</div></div><div class="card">Escenario 4%<div class="kpi">${years(.04)}</div></div><div class="card">Escenario 7%<div class="kpi">${years(.07)}</div></div><div class="card">Escenario 10%<div class="kpi">${years(.10)}</div></div></div><div class="notice">Proyección matemática, no garantía de rentabilidad.</div>`},riesgo(a){let t=total(),rows=assets().map(x=>[x[0],+x[1]]).sort((x,y)=>y[1]-x[1]),top=rows[0]||['—',0];a.innerHTML=`<h2>Riesgo</h2><div class="grid"><div class="card">Mayor posición<div class="kpi">${esc(top[0])}</div><span>${pct(top[1]/Math.max(1,t))} del patrimonio</span></div><div class="card">Liquidez<div class="kpi">${pct(liq()/Math.max(1,t))}</div></div><div class="card">Crypto<div class="kpi">${pct(crypto()/Math.max(1,t))}</div></div></div><div class="card section"><h3>Concentración</h3>${rows.slice(0,8).map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${pct(x[1]/Math.max(1,t))}</b></div>`).join('')}<p class="muted">La V4 debe vigilar concentración, deriva de pesos, drawdown y volatilidad antes de recomendar reforzar una posición.</p></div>`},decisiones(a){a.innerHTML=`<h2>Decisiones</h2><div class="card"><div class="form"><div>Activo<input id="da"></div><div>Decisión<select id="dt"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div><div>Motivo<input id="dr"></div></div><br><button class="action" onclick="decSave()">Guardar decisión</button></div><div class="card section">${data.decisions.map(x=>`<div class="row"><span><b>${esc(x.asset)}</b><br><span class="muted">${esc(x.reason)} · ${x.date}</span></span><span class="badge">${esc(x.type)}</span></div>`).join('')||'Sin decisiones todavía.'}</div>`},radar(a){a.innerHTML=`<h2>Radar de oportunidades</h2><div class="card"><div class="form"><div>Activo<input id="ra"></div><div>Precio actual<input id="rp" type="number"></div><div>Precio objetivo<input id="rt" type="number"></div><div>Tesis<input id="rx"></div></div><br><button class="action" onclick="radarSave()">Añadir</button></div><div class="card section">${data.radar.map(x=>`<div class="row"><span><b>${esc(x.asset)}</b><br><span class="muted">${esc(x.thesis)}</span></span><b>${x.price&&x.target?pct(x.target/x.price-1):'—'}</b></div>`).join('')||'Radar vacío.'}</div>`},historial(a){a.innerHTML=`<h2>Historial</h2><div class="grid"><div class="card">Aportado registrado<div class="kpi">${money(data.contributions.reduce((s,x)=>s+x.amount,0))}</div></div><div class="card">Decisiones<div class="kpi">${data.decisions.length}</div></div></div><div class="card section">${data.contributions.map(x=>`<div class="row"><span>${x.asset}<br><span class="muted">${x.date}</span></span><b>${money(x.amount)}</b></div>`).join('')||'Sin aportaciones registradas.'}</div>`},ajustes(a){a.innerHTML=`<h2>Ajustes</h2><div class="card"><div class="form"><div>Remunerada<input id="rem" type="number" value="${data.accounts.remunerada}"></div><div>Efectivo<input id="cash" type="number" value="${data.accounts.efectivo}"></div><div>ETH<input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div><div>Precio ETH<input id="ep" type="number" value="${data.crypto.ethPrice}"></div><div>Aportación semanal<input id="wk" type="number" value="${data.weekly}"></div><div>Objetivo<input id="tg" type="number" value="${data.target}"></div><div>Rentabilidad anual<input id="rr" type="number" step=".1" value="${data.returnRate}"></div><div>API mercado<input id="key" type="password" value="${data.market.apiKey||''}" placeholder="Twelve Data API key"></div></div><br><button class="action" onclick="settingsSave()">Guardar</button></div><div class="notice section">ETH puede actualizarse con CoinGecko. Para acciones/ETF, V4 queda preparada para un proveedor de cotizaciones con API. No guardamos la clave fuera de este dispositivo.</div>`}};
function allocation(){let t=total();return [...assets().map(x=>[x[0],+x[1]]),['Liquidez',liq()],['Crypto',crypto()]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>`<div class="row"><span>${esc(x[0])}<br><span class="muted">${money(x[1])}</span></span><span style="min-width:130px"><div class="bar"><div style="width:${Math.min(100,x[1]/Math.max(1,t)*100)}%"></div></div><span class="small">${pct(x[1]/Math.max(1,t))}</span></span></div>`).join('')}function aporte(){let f=find('MSCI World Acc');if(f)f[1]=+f[1]+data.weekly;else data.assets.push(['MSCI World Acc',data.weekly,'ETF']);data.contributions.unshift({date:new Date().toLocaleDateString('es-ES'),amount:+data.weekly,asset:'MSCI World Acc'});save();nav('historial')}function assetSave(){let n=an.value.trim(),v=+av.value;if(!n||!Number.isFinite(v))return;let f=find(n);if(f){f[1]=v;f[2]=at.value}else data.assets.push([n,v,at.value]);save();nav('cartera')}function decSave(){if(!da.value.trim())return;data.decisions.unshift({asset:da.value.trim(),type:dt.value,reason:dr.value.trim(),date:new Date().toLocaleDateString('es-ES')});save();nav('decisiones')}function radarSave(){if(!ra.value.trim())return;data.radar.unshift({asset:ra.value.trim(),price:+rp.value,target:+rt.value,thesis:rx.value.trim()});save();nav('radar')}function settingsSave(){data.accounts.remunerada=+rem.value;data.accounts.efectivo=+cash.value;data.crypto.eth=+eth.value;data.crypto.ethPrice=+ep.value;data.weekly=+wk.value;data.target=+tg.value;data.returnRate=+rr.value;data.market.apiKey=key.value;save();nav('dashboard')}async function syncMarket(){try{if(window.MarketV4){let r=await MarketV4.sync(data);if(r.ethPrice)data.crypto.ethPrice=r.ethPrice;data.market.lastSync=r.marketUpdatedAt?new Date(r.marketUpdatedAt).toLocaleString('es-ES'):new Date().toLocaleString('es-ES');save();nav('dashboard')}}catch(e){alert('No se pudo actualizar el mercado: '+e.message)}}const menu=[['dashboard','Dashboard'],['cartera','Cartera'],['liquidez','Liquidez'],['objetivo','Objetivo 1 M€'],['riesgo','Riesgo'],['decisiones','Decisiones'],['radar','Radar'],['historial','Historial'],['ajustes','Ajustes']];document.getElementById('nav').innerHTML=menu.map(x=>`<button data-p="${x[0]}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('');nav('dashboard');</script></body></html>
