<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Patrimonio V2"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Patrimonio V2</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#1f6feb;--green:#159957;--red:#d64545;--border:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:30px}header{background:var(--dark);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.7}nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:67px;z-index:4}nav button{border:0;background:#eef2f7;padding:10px 14px;border-radius:10px;white-space:nowrap;font-weight:600}nav button.active{background:var(--accent);color:#fff}main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.kpi{font-size:25px;font-weight:750;margin-top:7px}.muted{color:var(--muted);font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}h2{margin-top:8px}.section{margin:20px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.row:last-child{border-bottom:0}button.action{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 13px;font-weight:650}button.danger{background:#fff;color:var(--red);border:1px solid #f0caca}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}#app{min-height:70vh}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:600}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.hero .muted{color:#cbd5e1}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);border-radius:99px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);font-size:14px}.right{text-align:right}.small{font-size:12px}.install{display:none;margin-top:10px}
</style></head><body>
<header><h1>Patrimonio V2</h1><small>Centro de control patrimonial · Objetivo: máximo patrimonio</small></header><nav id="nav"></nav><main id="app"></main>
<script>
const KEY="patrimonio_v2";const defaultData={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:0.07,assets:[["First Solar",2300],["BYD",1800],["Netflix",1800],["Meta",1900],["Apple",1400],["Palantir",1400],["Toyota",1300],["AMD",1800],["Nvidia",1700],["CaixaBank",1100],["S&P 500 ETF",600],["Amazon",598],["NextEra Energy",520],["MSCI World Acc",0]],decisions:[]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(defaultData);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function invested(){return data.assets.reduce((a,x)=>a+Number(x[1]||0),0)}function cryptoValue(){return Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}function total(){return invested()+data.accounts.remunerada+data.accounts.efectivo+cryptoValue()}function money(n){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n)}function pct(n){return (n*100).toFixed(1)+"%"}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function setPage(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));const a=document.getElementById("app");({dashboard,cartera,liquidez,objetivo,decisiones,ajustes}[p])(a)}
function dashboard(a){const t=total(),inv=invested(),liq=data.accounts.remunerada+data.accounts.efectivo,progress=Math.min(100,t/data.target*100);a.innerHTML=`<div class="section"><div class="card hero"><span class="badge">CONTROL PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><p class="muted">Objetivo ${money(data.target)} · ${pct(t/data.target)} alcanzado</p><div class="progress"><div style="width:${progress}%"></div></div></div></div><div class="grid"><div class="card"><div class="muted">Invertido</div><div class="kpi">${money(inv)}</div></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(liq)}</div></div><div class="card"><div class="muted">Crypto</div><div class="kpi">${data.crypto.eth} ETH${data.crypto.ethPrice?" · "+money(cryptoValue()):""}</div></div><div class="card"><div class="muted">Aportación semanal</div><div class="kpi">${money(data.weekly)}</div></div></div><div class="section grid"><div class="card"><h3>¿Dónde pongo el próximo euro?</h3><p><b>MSCI World Acc</b></p><p class="muted">Mantener ${money(data.weekly)}/semana como núcleo. No concentrar nuevas aportaciones en posiciones individuales salvo que exista una oportunidad clara.</p></div><div class="card"><h3>Decisión semanal</h3><span class="badge">MANTENER</span><p class="muted">Estrategia base: diversificación global, aportación periódica y liquidez disponible para oportunidades.</p></div></div><div class="section card"><h3>Resumen</h3><div class="row"><span>Liquidez / patrimonio</span><b>${pct(liq/Math.max(1,t))}</b></div><div class="row"><span>Inversión / patrimonio</span><b>${pct(inv/Math.max(1,t))}</b></div><div class="row"><span>Faltan para 1 M€</span><b>${money(Math.max(0,data.target-t))}</b></div></div>`}
function cartera(a){a.innerHTML=`<div class="section"><h2>Cartera completa</h2><div class="card"><table><thead><tr><th>Activo</th><th class="right">Valor</th><th class="right">Peso</th></tr></thead><tbody>${data.assets.map(x=>`<tr><td>${esc(x[0])}</td><td class="right">${money(x[1])}</td><td class="right">${pct(Number(x[1])/Math.max(1,invested()))}</td></tr>`).join("")}</tbody></table></div><div class="card section"><h3>Añadir / actualizar activo</h3><div class="form"><div><label>Nombre</label><input id="aname" placeholder="MSCI World Acc"></div><div><label>Valor (€)</label><input id="avalue" type="number" min="0" step="1"></div></div><br><button class="action" onclick="upsertAsset()">Guardar activo</button></div></div>`}
function upsertAsset(){const n=document.getElementById("aname").value.trim(),v=Number(document.getElementById("avalue").value);if(!n||!Number.isFinite(v))return;const found=data.assets.find(x=>x[0].toLowerCase()===n.toLowerCase());if(found)found[1]=v;else data.assets.push([n,v]);save();setPage("cartera")}
function liquidez(a){a.innerHTML=`<div class="section"><h2>Liquidez</h2><div class="grid"><div class="card"><div class="muted">Cuenta remunerada</div><div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card"><div class="muted">Efectivo</div><div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card"><div class="muted">Liquidez total</div><div class="kpi">${money(data.accounts.remunerada+data.accounts.efectivo)}</div></div></div><div class="card section"><h3>Regla operativa</h3><p>Conservar un colchón de seguridad y utilizar entradas escalonadas. La aplicación no ejecuta operaciones: sirve para decidir y controlar.</p></div></div>`}
function objetivo(a){const t=total(),gap=Math.max(0,data.target-t),annual=data.weekly*52,rate=Number(data.returnRate||0)/100,months=[];let v=t;for(let y=1;y<=30;y++){v=v*(1+rate)+annual;if(v>=data.target){months.push(y);break}}const years=months[0]||">30";a.innerHTML=`<div class="section"><h2>Objetivo patrimonial</h2><div class="card hero"><div class="muted">Progreso hacia ${money(data.target)}</div><div class="kpi">${pct(t/data.target)}</div><p>${money(gap)} para alcanzar el objetivo.</p></div><div class="grid section"><div class="card"><div class="muted">Aportación anual</div><div class="kpi">${money(annual)}</div></div><div class="card"><div class="muted">Rentabilidad usada</div><div class="kpi">${Number(data.returnRate).toFixed(1)}%</div></div><div class="card"><div class="muted">Estimación 1 M€</div><div class="kpi">${years}${years!==">30"?" años":""}</div></div></div><div class="card"><p class="muted">Proyección orientativa con rentabilidad constante y aportaciones semanales. No es una garantía ni una recomendación de inversión.</p></div></div>`}
function decisiones(a){a.innerHTML=`<div class="section"><h2>Decisiones</h2><div class="card"><div class="form"><div><label>Activo</label><input id="dasset" placeholder="Ej. Meta"></div><div><label>Decisión</label><select id="dtype"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div></div><br><button class="action" onclick="addDecision()">Guardar decisión</button></div><div class="card section">${data.decisions.length?data.decisions.map(d=>`<div class="row"><span><b>${esc(d.asset)}</b><br><span class="muted">${d.date}</span></span><span class="badge">${d.type}</span></div>`).join(""):"Sin decisiones registradas todavía."}</div></div>`}
function addDecision(){const asset=document.getElementById("dasset").value.trim();if(!asset)return;data.decisions.unshift({asset,type:document.getElementById("dtype").value,date:new Date().toLocaleDateString("es-ES")});save();setPage("decisiones")}
function ajustes(a){a.innerHTML=`<div class="section"><h2>Ajustes</h2><div class="card"><div class="form"><div><label>Cuenta remunerada (€)</label><input id="rem" type="number" value="${data.accounts.remunerada}"></div><div><label>Efectivo (€)</label><input id="cash" type="number" value="${data.accounts.efectivo}"></div><div><label>ETH</label><input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div><div><label>Precio ETH (€)</label><input id="ethprice" type="number" step="1" value="${data.crypto.ethPrice||0}"></div><div><label>Aportación semanal (€)</label><input id="weekly" type="number" value="${data.weekly}"></div><div><label>Objetivo (€)</label><input id="target" type="number" value="${data.target}"></div><div><label>Rentabilidad anual estimada (%)</label><input id="rate" type="number" step="0.1" value="${data.returnRate}"></div></div><br><button class="action" onclick="updateSettings()">Guardar</button></div><div class="card section"><h3>Datos</h3><p class="muted">Los datos se guardan localmente en este dispositivo mediante localStorage.</p><button class="action danger" onclick="resetData()">Restablecer datos iniciales</button></div></div>`}
function updateSettings(){data.accounts.remunerada=+rem.value;data.accounts.efectivo=+cash.value;data.crypto.eth=+eth.value;data.crypto.ethPrice=+ethprice.value;data.weekly=+weekly.value;data.target=+target.value;data.returnRate=+rate.value;save();setPage("dashboard")}function resetData(){if(confirm("¿Restablecer los datos iniciales?")){data=structuredClone(defaultData);save();setPage("dashboard")}}
const pages=[["dashboard","Dashboard"],["cartera","Cartera"],["liquidez","Liquidez"],["objetivo","Objetivo 1 M€"],["decisiones","Decisiones"],["ajustes","Ajustes"]];document.getElementById("nav").innerHTML=pages.map(([p,n])=>`<button data-p="${p}" onclick="setPage('${p}')">${n}</button>`).join("");if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});setPage("dashboard");
</script></body></html>
