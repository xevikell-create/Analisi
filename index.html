<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><title>Patrimonio V4</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#687384;--accent:#2563eb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.7}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:66px;z-index:4}nav button{border:0;background:#eef2f7;padding:9px 12px;border-radius:10px;white-space:nowrap;font-weight:650}nav button.active{background:var(--accent);color:#fff}main{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:680px){.two{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;box-shadow:0 2px 8px #00000008}.hero{background:linear-gradient(135deg,#111827,#294778);color:#fff}.hero .muted{color:#cbd5e1}.kpi{font-size:26px;font-weight:800;margin-top:6px}.muted{color:var(--muted);font-size:13px}.section{margin:16px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:11px 0}.row:last-child{border:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:700}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.progress{height:11px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent)}button.action{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:700}button.secondary{background:#eef2f7;border:0;border-radius:10px;padding:10px 13px;font-weight:650}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px;background:#fff}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:14px}.right{text-align:right}.chart{width:100%;height:250px}.score{font-size:21px;font-weight:800}.meter{height:9px;background:#eee;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
</style></head><body><header><h1>Patrimonio V4</h1><small>Centro de control patrimonial · decisiones basadas en datos</small></header><nav id="nav"></nav><main id="app"></main><script>
const KEY='patrimonio_v4';const seed={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,riskLimit:10,minCash:30000,assets:[['First Solar',2300,'USA','Tecnología/energía',8],['BYD',1800,'China','Industria',7],['Netflix',1800,'USA','Comunicación',7],['Meta',1900,'USA','Tecnología',8],['Apple',1400,'USA','Tecnología',8],['Palantir',1400,'USA','Tecnología',9],['Toyota',1300,'Japón','Consumo',6],['AMD',1800,'USA','Tecnología',9],['Nvidia',1700,'USA','Tecnología',10],['CaixaBank',1100,'España','Finanzas',6],['S&P 500 ETF',600,'USA','Índice',5],['Amazon',598,'USA','Consumo',8],['NextEra Energy',520,'USA','Energía',6],['MSCI World Acc',0,'Global','Índice',3]],history:[],contributions:[],opportunities:[],decisions:[]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0)}function pct(n){return ((Number(n)||0)*100).toFixed(1)+'%'}function invested(){return data.assets.reduce((s,x)=>s+Number(x[1]||0),0)}function crypto(){return Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}function total(){return invested()+data.accounts.remunerada+data.accounts.efectivo+crypto()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}
const pages={dashboard,patrimonio,cartera,aportaciones,oportunidades,proximo,riesgo,evolucion,objetivos,decisiones,ajustes};function nav(){document.getElementById('nav').innerHTML=Object.keys(pages).map(p=>`<button data-p="${p}" onclick="go('${p}')">${({dashboard:'📊',patrimonio:'💰',cartera:'📈',aportaciones:'💶',oportunidades:'🔎',proximo:'🧠',riesgo:'⚠️',evolucion:'📉',objetivos:'🎯',decisiones:'📝',ajustes:'⚙️'})[p]} ${({dashboard:'Dashboard',patrimonio:'Patrimonio',cartera:'Cartera',aportaciones:'Aportaciones',oportunidades:'Oportunidades',proximo:'Próximo euro',riesgo:'Riesgo',evolucion:'Evolución',objetivos:'Objetivos',decisiones:'Decisiones',ajustes:'Ajustes'})[p]}</button>`).join('')}function go(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));pages[p](document.getElementById('app'))}
function recommendation(){let t=total(),cash=data.accounts.remunerada+data.accounts.efectivo;if(data.opportunities.length){let o=data.opportunities.slice().sort((a,b)=>b.score-a.score)[0];if(o.score>=75)return{action:'REFORZAR',asset:o.asset,amount:data.weekly,score:o.score,reason:o.reason||'Mejor oportunidad registrada, pendiente de verificar datos.'}}if(cash>data.minCash+data.weekly)return{action:'COMPRAR',asset:'MSCI World Acc',amount:data.weekly,score:72,reason:'Núcleo diversificado mientras no exista una oportunidad con ventaja suficiente.'};return{action:'ESPERAR',asset:'Liquidez',amount:0,score:60,reason:'Priorizar colchón de liquidez antes de asumir más riesgo.'}}
function dashboard(a){let t=total(),r=recommendation(),cash=data.accounts.remunerada+data.accounts.efectivo,gap=Math.max(0,data.target-t);a.innerHTML=`<div class="section"><div class="card hero"><span class="badge">SISTEMA PATRIMONIAL</span><h2>Patrimonio neto</h2><div class="kpi">${money(t)}</div><p class="muted">${pct(t/data.target)} del objetivo de ${money(data.target)}</p><div class="progress"><div style="width:${Math.min(100,t/data.target*100)}%"></div></div></div></div><div class="grid"><div class="card"><div class="muted">Invertido</div><div class="kpi">${money(invested())}</div></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(cash)}</div></div><div class="card"><div class="muted">ETH</div><div class="kpi">${data.crypto.eth} ${data.crypto.ethPrice?money(crypto()):''}</div></div><div class="card"><div class="muted">Aportación semanal</div><div class="kpi">${money(data.weekly)}</div></div></div><div class="section two"><div class="card"><h3>🧠 ¿Dónde va el próximo euro?</h3><div class="score">${r.action} · ${esc(r.asset)}</div><p>${esc(r.reason)}</p><b>${r.amount?money(r.amount):'0 €'}</b><p class="muted">Convicción ${r.score}/100 · decisión orientativa.</p></div><div class="card"><h3>🔎 Mejor oportunidad</h3>${data.opportunities.length?opportunityList(3):'<p class="muted">Registra oportunidades verificadas para activar el ranking.</p>'}</div></div><div class="section two"><div class="card"><h3>🩻 Rayos X</h3><div class="row"><span>Liquidez</span><b>${pct(cash/Math.max(t,1))}</b></div><div class="row"><span>Renta variable/activos</span><b>${pct(invested()/Math.max(t,1))}</b></div><div class="row"><span>Mayor posición</span><b>${topAsset()}</b></div><button class="secondary" onclick="go('riesgo')">Ver análisis de riesgo</button></div><div class="card"><h3>🎯 Trayectoria</h3><div class="row"><span>Faltan</span><b>${money(gap)}</b></div><div class="row"><span>Aportación anual</span><b>${money(data.weekly*52)}</b></div><div class="row"><span>Rentabilidad escenario</span><b>${data.returnRate}%</b></div><button class="secondary" onclick="go('objetivos')">Ver proyección</button></div></div>`}
function topAsset(){let x=[...data.assets].sort((a,b)=>b[1]-a[1])[0];return x?`${esc(x[0])} · ${pct(x[1]/Math.max(1,invested()))}`:'—'}
function patrimonio(a){let t=total();a.innerHTML=`<div class="section"><h2>💰 Patrimonio completo</h2><div class="grid"><div class="card"><div class="muted">Activos financieros</div><div class="kpi">${money(invested()+crypto())}</div></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(data.accounts.remunerada+data.accounts.efectivo)}</div></div><div class="card"><div class="muted">Deudas registradas</div><div class="kpi">${money(data.debt||0)}</div></div><div class="card"><div class="muted">Patrimonio neto</div><div class="kpi">${money(t-(data.debt||0))}</div></div></div><div class="card section"><h3>Registrar deuda</h3><div class="form"><div><label>Deuda total (€)</label><input id="debt" type="number" value="${data.debt||0}"></div></div><br><button class="action" onclick="setDebt()">Guardar</button></div></div>`}function setDebt(){data.debt=Number(document.getElementById('debt').value)||0;save();go('patrimonio')}
function cartera(a){a.innerHTML=`<div class="section"><h2>📈 Cartera</h2><div class="card"><table><tr><th>Activo</th><th>Región</th><th>Sector</th><th class="right">Valor</th><th class="right">Peso</th></tr>${data.assets.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[2]||'—')}</td><td>${esc(x[3]||'—')}</td><td class="right">${money(x[1])}</td><td class="right">${pct(x[1]/Math.max(1,invested()))}</td></tr>`).join('')}</table></div><div class="card section"><h3>Añadir/actualizar posición</h3><div class="form"><div><label>Activo</label><input id="an" placeholder="Meta"></div><div><label>Valor €</label><input id="av" type="number"></div><div><label>Región</label><input id="ar" placeholder="USA"></div><div><label>Sector</label><input id="as" placeholder="Tecnología"></div></div><br><button class="action" onclick="assetSave()">Guardar</button></div></div>`}function assetSave(){let n=document.getElementById('an').value.trim(),v=Number(document.getElementById('av').value),r=document.getElementById('ar').value,s=document.getElementById('as').value;if(!n||!isFinite(v))return;let x=data.assets.find(x=>x[0].toLowerCase()===n.toLowerCase());if(x){x[1]=v;x[2]=r;x[3]=s}else data.assets.push([n,v,r,s,5]);save();go('cartera')}
function aportaciones(a){let sum=data.contributions.reduce((s,x)=>s+x.amount,0);a.innerHTML=`<div class="section"><h2>💶 Aportaciones</h2><div class="grid"><div class="card"><div class="muted">Acumulado</div><div class="kpi">${money(sum)}</div></div><div class="card"><div class="muted">Registros</div><div class="kpi">${data.contributions.length}</div></div><div class="card"><div class="muted">Objetivo semanal</div><div class="kpi">${money(data.weekly)}</div></div></div><div class="card section"><h3>Registrar aportación</h3><div class="form"><div><label>Fecha</label><input id="cd" type="date" value="${today()}"></div><div><label>Importe</label><input id="ca" type="number" value="${data.weekly}"></div><div><label>Destino</label><select id="ct"><option>MSCI World Acc</option><option>Acción</option><option>ETF</option><option>Crypto</option><option>Liquidez</option><option>Otro</option></select></div></div><br><button class="action" onclick="addContribution()">Registrar</button></div><div class="card">${data.contributions.slice().reverse().map(x=>`<div class="row"><span>${x.date}<br><span class="muted">${esc(x.dest)}</span></span><b>${money(x.amount)}</b></div>`).join('')||'<p class="muted">Aún no hay registros.</p>'}</div></div>`}function addContribution(){let d=document.getElementById('cd').value,v=Number(document.getElementById('ca').value),dest=document.getElementById('ct').value;if(!d||!v)return;data.contributions.push({date:d,amount:v,dest});save();go('aportaciones')}
function opportunityList(n=10){return data.opportunities.slice().sort((a,b)=>b.score-a.score).slice(0,n).map(o=>`<div class="row"><span><b>${esc(o.asset)}</b><br><span class="muted">${o.score}/100 · ${esc(o.reason||'')}</span></span><b class="${o.score>=75?'green':o.score>=55?'amber':'red'}">${o.action}</b></div>`).join('')}
function oportunidades(a){a.innerHTML=`<div class="section"><h2>🔎 Radar de oportunidades</h2><p class="muted">El motor solo utiliza datos que tú introduzcas/verifiques. No inventa cotizaciones, noticias ni ratios.</p><div class="card"><div class="form"><div><label>Activo</label><input id="oa" placeholder="Meta"></div><div><label>Valoración 0-100</label><input id="ov" type="number" value="70" min="0" max="100"></div><div><label>Calidad 0-100</label><input id="oq" type="number" value="80" min="0" max="100"></div><div><label>Crecimiento/catalizador 0-100</label><input id="og" type="number" value="70" min="0" max="100"></div><div><label>Riesgo 0-100 (100=máximo)</label><input id="or" type="number" value="35" min="0" max="100"></div><div><label>Motivo</label><input id="ox" placeholder="Caída + tesis intacta"></div></div><br><button class="action" onclick="addOpp()">Añadir al radar</button></div><div class="card section"><h3>Ranking</h3>${opportunityList()||'<p class="muted">Sin oportunidades.</p>'}</div></div>`}function addOpp(){let asset=document.getElementById('oa').value.trim(),v=+document.getElementById('ov').value,q=+document.getElementById('oq').value,g=+document.getElementById('og').value,r=+document.getElementById('or').value,reason=document.getElementById('ox').value;if(!asset)return;let score=Math.round(v*.35+q*.30+g*.20+(100-r)*.15),action=score>=80?'REFORZAR':score>=70?'COMPRAR':score>=55?'ESPERAR':'EVITAR';data.opportunities=data.opportunities.filter(o=>o.asset.toLowerCase()!==asset.toLowerCase());data.opportunities.push({asset,score,action,reason,updated:today()});save();go('oportunidades')}
function proximo(a){let r=recommendation();a.innerHTML=`<div class="section"><h2>🧠 ¿Dónde va el próximo euro?</h2><div class="card hero"><span class="badge">DECISIÓN DEL SISTEMA</span><h2>${r.action} · ${esc(r.asset)}</h2><div class="kpi">${r.amount?money(r.amount):'0 €'}</div><p>${esc(r.reason)}</p><p>Convicción: <b>${r.score}/100</b></p></div><div class="card section"><h3>Reglas</h3><div class="row"><span>Aportación disponible</span><b>${money(data.weekly)}</b></div><div class="row"><span>Liquidez actual</span><b>${money(data.accounts.remunerada+data.accounts.efectivo)}</b></div><div class="row"><span>Liquidez mínima</span><b>${money(data.minCash)}</b></div><p class="muted">La recomendación no ejecuta operaciones. Si no hay ventaja suficiente, el sistema puede decir ESPERAR.</p><button class="action" onclick="recordDecision()">Registrar esta decisión</button></div></div>`}function recordDecision(){let r=recommendation();data.decisions.push({date:today(),action:r.action,asset:r.asset,amount:r.amount,score:r.score,result:'Pendiente'});save();go('decisiones')}
function riesgo(a){let t=Math.max(1,invested()),cash=data.accounts.remunerada+data.accounts.efectivo,top=Math.max(...data.assets.map(x=>x[1]),0)/t;let sectors={};data.assets.forEach(x=>sectors[x[3]||'Sin sector']=(sectors[x[3]||'Sin sector']||0)+x[1]);let topSector=Object.entries(sectors).sort((a,b)=>b[1]-a[1])[0]||['—',0];a.innerHTML=`<div class="section"><h2>⚠️ Riesgo y Rayos X</h2><div class="grid"><div class="card"><div class="muted">Mayor posición</div><div class="kpi">${pct(top)}</div></div><div class="card"><div class="muted">Mayor sector</div><div class="kpi">${pct(topSector[1]/t)}</div><span>${esc(topSector[0])}</span></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${pct(cash/Math.max(1,total()))}</div></div><div class="card"><div class="muted">Concentración límite</div><div class="kpi">${data.riskLimit}%</div></div></div><div class="card section"><h3>Diagnóstico</h3><div class="row"><span>Concentración individual</span><b class="${top>data.riskLimit/100?'red':'green'}">${top>data.riskLimit/100?'REVISAR':'OK'}</b></div><div class="row"><span>Colchón de liquidez</span><b class="${cash<data.minCash?'red':'green'}">${cash<data.minCash?'BAJO':'OK'}</b></div><div class="row"><span>Diversificación sectorial</span><b>${Object.keys(sectors).length} sectores registrados</b></div></div><div class="card"><h3>Exposición por sector</h3>${Object.entries(sectors).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${pct(x[1]/t)}</b></div>`).join('')}</div></div>`}
function evolucion(a){a.innerHTML=`<div class="section"><h2>📉 Evolución</h2><div class="card"><canvas id="chart" class="chart"></canvas></div><div class="card section"><h3>Nuevo cierre</h3><div class="form"><div><label>Fecha</label><input id="hd" type="date" value="${today()}"></div><div><label>Patrimonio</label><input id="hv" type="number" value="${Math.round(total())}"></div></div><br><button class="action" onclick="addHistory()">Guardar cierre</button></div><div class="card">${data.history.slice().reverse().map(x=>`<div class="row"><span>${x.date}</span><b>${money(x.value)}</b></div>`).join('')||'<p class="muted">Añade el primer cierre para iniciar la curva.</p>'}</div></div>`;draw(document.getElementById('chart'),data.history)}function addHistory(){let d=document.getElementById('hd').value,v=+document.getElementById('hv').value;if(!d||!v)return;data.history=data.history.filter(x=>x.date!==d);data.history.push({date:d,value:v});data.history.sort((a,b)=>a.date.localeCompare(b.date));save();go('evolucion')}function draw(c,h){if(!c)return;let ctx=c.getContext('2d'),w=c.width=c.clientWidth*2,hh=c.height=c.clientHeight*2;ctx.scale(2,2);w/=2;hh/=2;ctx.clearRect(0,0,w,hh);if(h.length<2){ctx.fillStyle='#687384';ctx.font='14px sans-serif';ctx.fillText('Necesitas al menos 2 cierres para ver la evolución.',15,35);return}let min=Math.min(...h.map(x=>x.value)),max=Math.max(...h.map(x=>x.value)),dx=w/(h.length-1),dy=(hh-40)/Math.max(1,max-min);ctx.beginPath();h.forEach((x,i)=>{let X=i*dx,Y=hh-20-(x.value-min)*dy;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.stroke()}
function objetivos(a){let t=total(),annual=data.weekly*52,rate=data.returnRate/100,v=t;let years='>30';for(let y=1;y<=30;y++){v=v*(1+rate)+annual;if(v>=data.target){years=y;break}}a.innerHTML=`<div class="section"><h2>🎯 Objetivos</h2><div class="card hero"><div class="muted">Objetivo principal</div><div class="kpi">${money(data.target)}</div><p>${pct(t/data.target)} alcanzado · faltan ${money(Math.max(0,data.target-t))}</p></div><div class="grid"><div class="card"><div class="muted">Aportación anual</div><div class="kpi">${money(annual)}</div></div><div class="card"><div class="muted">Escenario usado</div><div class="kpi">${data.returnRate}%</div></div><div class="card"><div class="muted">Estimación</div><div class="kpi">${years} años</div></div></div><div class="card section"><p class="muted">Proyección matemática orientativa: rentabilidad constante y aportaciones semanales. No es una garantía.</p></div></div>`}
function decisiones(a){a.innerHTML=`<div class="section"><h2>📝 Historial de decisiones</h2><div class="card">${data.decisions.slice().reverse().map((d,i)=>`<div class="row"><span><b>${d.date} · ${d.action}</b><br>${esc(d.asset)} · ${money(d.amount)}<br><span class="muted">Convicción ${d.score}/100</span></span><b>${esc(d.result)}</b></div>`).join('')||'<p class="muted">Todavía no hay decisiones registradas.</p>'}</div><div class="card section"><h3>Aprendizaje</h3><p>Cuando actualicemos el resultado de cada decisión podremos medir aciertos, errores y rentabilidad de nuestras decisiones frente a la estrategia base.</p></div></div>`}
function ajustes(a){a.innerHTML=`<div class="section"><h2>⚙️ Ajustes</h2><div class="card"><div class="form"><div><label>Aportación semanal</label><input id="sw" type="number" value="${data.weekly}"></div><div><label>Objetivo €</label><input id="tg" type="number" value="${data.target}"></div><div><label>Rentabilidad escenario %</label><input id="rr" type="number" value="${data.returnRate}"></div><div><label>Liquidez mínima €</label><input id="mc" type="number" value="${data.minCash}"></div><div><label>Límite por posición %</label><input id="rl" type="number" value="${data.riskLimit}"></div><div><label>ETH</label><input id="eh" type="number" step="0.0001" value="${data.crypto.eth}"></div><div><label>Precio ETH €</label><input id="ep" type="number" value="${data.crypto.ethPrice}"></div></div><br><button class="action" onclick="settingsSave()">Guardar ajustes</button></div><div class="card section"><h3>Datos de mercado</h3><p class="muted">La app está preparada para recibir datos reales, pero no inventa precios ni noticias. Las oportunidades deben estar verificadas antes de influir en la recomendación.</p></div></div>`}function settingsSave(){data.weekly=+document.getElementById('sw').value;data.target=+document.getElementById('tg').value;data.returnRate=+document.getElementById('rr').value;data.minCash=+document.getElementById('mc').value;data.riskLimit=+document.getElementById('rl').value;data.crypto.eth=+document.getElementById('eh').value;data.crypto.ethPrice=+document.getElementById('ep').value;save();go('ajustes')}
nav();go('dashboard');
</script></body></html>
