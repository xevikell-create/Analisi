<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Patrimonio V3"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Patrimonio V3</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#1f6feb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:30px}header{background:var(--dark);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.7}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:67px;z-index:4}nav button{border:0;background:#eef2f7;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:650}nav button.active{background:var(--accent);color:#fff}main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.kpi{font-size:25px;font-weight:750;margin-top:7px}.muted{color:var(--muted);font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--amber)}h2{margin-top:8px}.section{margin:20px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.row:last-child{border-bottom:0}button.action{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 13px;font-weight:650}button.secondary{background:#eef2f7;color:var(--text);border:0;border-radius:10px;padding:10px 13px;font-weight:650}button.danger{background:#fff;color:var(--red);border:1px solid #f0caca}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px;background:white}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}#app{min-height:70vh}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:650}.badge.green{background:#e9f7ef;color:#147a45}.badge.red{background:#fdeeee;color:#a52d2d}.badge.amber{background:#fff6df;color:#8b5e12}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.hero .muted{color:#cbd5e1}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);border-radius:99px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);font-size:14px}.right{text-align:right}.small{font-size:12px}.chart{width:100%;height:260px}.score{font-size:20px;font-weight:750}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.two{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Patrimonio V3</h1><small>Centro de control patrimonial · Objetivo: máximo patrimonio</small></header><nav id="nav"></nav><main id="app"></main>
<script>
const KEY="patrimonio_v3";
const defaults={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:[["First Solar",2300],["BYD",1800],["Netflix",1800],["Meta",1900],["Apple",1400],["Palantir",1400],["Toyota",1300],["AMD",1800],["Nvidia",1700],["CaixaBank",1100],["S&P 500 ETF",600],["Amazon",598],["NextEra Energy",520],["MSCI World Acc",0]],history:[],contributions:[],opportunities:[],decisions:[]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(defaults);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function invested(){return data.assets.reduce((a,x)=>a+Number(x[1]||0),0)}function cryptoValue(){return Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}function total(){return invested()+Number(data.accounts.remunerada||0)+Number(data.accounts.efectivo||0)+cryptoValue()}function money(n){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n)||0)}function pct(n){return ((Number(n)||0)*100).toFixed(1)+"%"}function dateNow(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function setPage(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));({dashboard,cartera,liquidez,evolucion,aportaciones,oportunidades,objetivo,decisiones,ajustes}[p])(document.getElementById("app"))}
function dashboard(a){let t=total(),inv=invested(),liq=data.accounts.remunerada+data.accounts.efectivo,progress=Math.min(100,t/data.target*100),rec=recommend();a.innerHTML=`<div class="section"><div class="card hero"><span class="badge">CONTROL PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><p class="muted">Objetivo ${money(data.target)} · ${pct(t/data.target)} alcanzado</p><div class="progress"><div style="width:${progress}%"></div></div></div></div><div class="grid"><div class="card"><div class="muted">Invertido</div><div class="kpi">${money(inv)}</div></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(liq)}</div></div><div class="card"><div class="muted">Crypto</div><div class="kpi">${data.crypto.eth} ETH${data.crypto.ethPrice?" · "+money(cryptoValue()):""}</div></div><div class="card"><div class="muted">Aportación semanal</div><div class="kpi">${money(data.weekly)}</div></div></div><div class="section two"><div class="card"><h3>🧠 ¿Dónde pongo el próximo euro?</h3><div class="score">${esc(rec.action)} · ${esc(rec.asset)}</div><p>${esc(rec.reason)}</p><p class="muted">Confianza interna: ${rec.score}/100. La decisión es orientativa y no ejecuta operaciones.</p></div><div class="card"><h3>🔎 Radar de oportunidades</h3>${opportunityRows(3)}</div></div><div class="section card"><h3>📈 Evolución</h3><canvas id="dashChart" class="chart"></canvas><p class="muted">Añade cierres en Evolución para construir tu curva real.</p></div><div class="section card"><h3>Resumen de control</h3><div class="row"><span>Liquidez / patrimonio</span><b>${pct(liq/Math.max(1,t))}</b></div><div class="row"><span>Inversión / patrimonio</span><b>${pct(inv/Math.max(1,t))}</b></div><div class="row"><span>Aportado acumulado</span><b>${money(data.contributions.reduce((s,c)=>s+Number(c.amount||0),0))}</b></div><div class="row"><span>Faltan para 1 M€</span><b>${money(Math.max(0,data.target-t))}</b></div></div>`;drawChart(document.getElementById("dashChart"),data.history)}
function cartera(a){a.innerHTML=`<div class="section"><h2>Cartera completa</h2><div class="card"><table><thead><tr><th>Activo</th><th class="right">Valor</th><th class="right">Peso</th></tr></thead><tbody>${data.assets.map(x=>`<tr><td>${esc(x[0])}</td><td class="right">${money(x[1])}</td><td class="right">${pct(Number(x[1])/Math.max(1,invested()))}</td></tr>`).join("")}</tbody></table></div><div class="card section"><h3>Añadir / actualizar activo</h3><div class="form"><div><label>Nombre</label><input id="aname" placeholder="MSCI World Acc"></div><div><label>Valor (€)</label><input id="avalue" type="number" min="0"></div></div><br><button class="action" onclick="upsertAsset()">Guardar activo</button></div></div>`}
function upsertAsset(){let n=document.getElementById("aname").value.trim(),v=Number(document.getElementById("avalue").value);if(!n||!Number.isFinite(v))return;let f=data.assets.find(x=>x[0].toLowerCase()===n.toLowerCase());f?f[1]=v:data.assets.push([n,v]);save();setPage("cartera")}
function liquidez(a){a.innerHTML=`<div class="section"><h2>Liquidez</h2><div class="grid"><div class="card"><div class="muted">Cuenta remunerada</div><div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card"><div class="muted">Efectivo</div><div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card"><div class="muted">Liquidez total</div><div class="kpi">${money(data.accounts.remunerada+data.accounts.efectivo)}</div></div></div><div class="card section"><h3>Regla operativa</h3><p>Colchón de seguridad + entradas escalonadas. La liquidez se considera también una opción estratégica para oportunidades.</p></div></div>`}
function evolucion(a){a.innerHTML=`<div class="section"><h2>📈 Evolución del patrimonio</h2><div class="card"><canvas id="evoChart" class="chart"></canvas></div><div class="card section"><h3>Añadir cierre patrimonial</h3><p class="muted">Introduce el patrimonio total que ves ese día. Así construiremos tu histórico real.</p><div class="form"><div><label>Fecha</label><input id="hdate" type="date" value="${dateNow()}"></div><div><label>Patrimonio total (€)</label><input id="hvalue" type="number" value="${Math.round(total())}"></div></div><br><button class="action" onclick="addHistory()">Guardar cierre</button></div><div class="card"><h3>Histórico</h3>${data.history.slice().reverse().map((h,i)=>`<div class="row"><span>${h.date}</span><b>${money(h.value)}</b></div>`).join("")||'<p class="muted">Todavía no hay cierres históricos.</p>'}</div></div>`;drawChart(document.getElementById("evoChart"),data.history)}
function addHistory(){let d=document.getElementById("hdate").value,v=Number(document.getElementById("hvalue").value);if(!d||!Number.isFinite(v))return;data.history=data.history.filter(h=>h.date!==d);data.history.push({date:d,value:v});data.history.sort((a,b)=>a.date.localeCompare(b.date));save();setPage("evolucion")}
function aportaciones(a){let sum=data.contributions.reduce((s,c)=>s+Number(c.amount||0),0);a.innerHTML=`<div class="section"><h2>💶 Aportaciones</h2><div class="grid"><div class="card"><div class="muted">Acumulado</div><div class="kpi">${money(sum)}</div></div><div class="card"><div class="muted">Media por registro</div><div class="kpi">${money(data.contributions.length?sum/data.contributions.length:0)}</div></div><div class="card"><div class="muted">Aportación semanal objetivo</div><div class="kpi">${money(data.weekly)}</div></div></div><div class="card section"><h3>Registrar aportación</h3><div class="form"><div><label>Fecha</label><input id="cdate" type="date" value="${dateNow()}"></div><div><label>Importe (€)</label><input id="camount" type="number" value="${data.weekly}"></div><div><label>Destino</label><select id="cdest"><option>MSCI World Acc</option><option>Liquidez</option><option>Acción</option><option>Crypto</option><option>Otro</option></select></div></div><br><button class="action" onclick="addContribution()">Registrar</button></div><div class="card"><h3>Histórico</h3>${data.contributions.slice().reverse().map(c=>`<div class="row"><span>${c.date}<br><span class="muted">${esc(c.dest)}</span></span><b>${money(c.amount)}</b></div>`).join("")||'<p class="muted">Sin aportaciones registradas.</p>'}</div></div>`}
function addContribution(){let d=document.getElementById("cdate").value,v=Number(document.getElementById("camount").value),dest=document.getElementById("cdest").value;if(!d||!Number.isFinite(v)||v<=0)return;data.contributions.push({date:d,amount:v,dest});save();setPage("aportaciones")}
function opportunityRows(n=10){let arr=data.opportunities.slice().sort((a,b)=>Number(b.score)-Number(a.score)).slice(0,n);return arr.length?arr.map(o=>`<div class="row"><span><b>${esc(o.asset)}</b><br><span class="muted">Score ${o.score}/100 · ${esc(o.note||'')}</span></span><span class="badge ${o.score>=75?'green':o.score>=55?'amber':'red'}">${o.action}</span></div>`).join(""):'<p class="muted">Añade activos al radar para empezar a puntuar oportunidades.</p>'}
function oportunidades(a){a.innerHTML=`<div class="section"><h2>🔎 Radar de oportunidades</h2><p class="muted">Puntúa cada oportunidad con datos que tú verifiques. El motor ordena las opciones; no inventa cotizaciones ni noticias.</p><div class="card"><div class="form"><div><label>Activo</label><input id="oasset" placeholder="Meta"></div><div><label>Valoración atractiva 0-100</label><input id="oval" type="number" min="0" max="100" value="70"></div><div><label>Calidad 0-100</label><input id="oqual" type="number" min="0" max="100" value="80"></div><div><label>Momentum / caída 0-100</label><input id="omom" type="number" min="0" max="100" value="60"></div><div><label>Riesgo 0-100</label><input id="orisk" type="number" min="0" max="100" value="40"></div><div><label>Comentario</label><input id="onote" placeholder="Por qué me interesa"></div></div><br><button class="action" onclick="addOpportunity()">Analizar oportunidad</button></div><div class="card section"><h3>Ranking</h3>${opportunityRows(20)}</div></div>`}
function addOpportunity(){let asset=document.getElementById("oasset").value.trim();if(!asset)return;let val=+oval.value,qual=+oqual.value,mom=+omom.value,risk=+orisk.value;let score=Math.round(val*.35+qual*.3+mom*.2+(100-risk)*.15);let action=score>=78?'REFORZAR':score>=65?'VIGILAR':score>=50?'MANTENER':'ESPERAR';data.opportunities=data.opportunities.filter(o=>o.asset.toLowerCase()!==asset.toLowerCase());data.opportunities.push({asset,score,action,note:onote.value,val,qual,mom,risk});save();setPage("oportunidades")}
function recommend(){if(!data.opportunities.length)return{asset:"MSCI World Acc",action:"APORTAR",score:70,reason:"Usar el índice global como núcleo y mantener la disciplina de aportación periódica."};let o=data.opportunities.slice().sort((a,b)=>b.score-a.score)[0];if(o.score<65)return{asset:"MSCI World Acc",action:"APORTAR",score:70,reason:"Ninguna oportunidad del radar supera el umbral; mantener la estrategia núcleo."};return{asset:o.asset,action:o.action,score:o.score,reason:o.note||"Es la oportunidad con mejor puntuación del radar."}}
function objetivo(a){let t=total(),gap=Math.max(0,data.target-t),annual=data.weekly*52,rate=Number(data.returnRate)/100,v=t,years=null;for(let y=1;y<=40;y++){v=v*(1+rate)+annual;if(v>=data.target){years=y;break}}a.innerHTML=`<div class="section"><h2>🎯 Objetivo 1 M€</h2><div class="card hero"><div class="muted">Progreso</div><div class="kpi">${pct(t/data.target)}</div><p>${money(gap)} para alcanzar el objetivo.</p><div class="progress"><div style="width:${Math.min(100,t/data.target*100)}%"></div></div></div><div class="grid section"><div class="card"><div class="muted">Aportación anual</div><div class="kpi">${money(annual)}</div></div><div class="card"><div class="muted">Rentabilidad de escenario</div><div class="kpi">${data.returnRate.toFixed(1)}%</div></div><div class="card"><div class="muted">Escenario central</div><div class="kpi">${years?years+' años':'>40 años'}</div></div></div><div class="card"><p class="muted">Proyección matemática, no garantía. La app debe usarse como sistema de control y decisión, no como sustituto de asesoramiento regulado.</p></div></div>`}
function decisiones(a){a.innerHTML=`<div class="section"><h2>📝 Historial de decisiones</h2><div class="card"><div class="form"><div><label>Activo</label><input id="dasset" placeholder="Meta"></div><div><label>Decisión</label><select id="dtype"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div><div><label>Precio/valor de referencia</label><input id="dref" type="number"></div></div><br><button class="action" onclick="addDecision()">Guardar decisión</button></div><div class="card section">${data.decisions.length?data.decisions.map(d=>`<div class="row"><span><b>${esc(d.asset)}</b><br><span class="muted">${d.date}${d.ref?' · ref. '+money(d.ref):''}</span></span><span class="badge">${d.type}</span></div>`).join(""):'<p class="muted">Sin decisiones registradas.</p>'}</div></div>`}
function addDecision(){let asset=document.getElementById("dasset").value.trim();if(!asset)return;data.decisions.unshift({asset,type:document.getElementById("dtype").value,date:dateNow(),ref:Number(document.getElementById("dref").value)||0});save();setPage("decisiones")}
function ajustes(a){a.innerHTML=`<div class="section"><h2>⚙️ Ajustes</h2><div class="card"><div class="form"><div><label>Cuenta remunerada (€)</label><input id="rem" type="number" value="${data.accounts.remunerada}"></div><div><label>Efectivo (€)</label><input id="cash" type="number" value="${data.accounts.efectivo}"></div><div><label>ETH</label><input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div><div><label>Precio ETH (€)</label><input id="ethprice" type="number" value="${data.crypto.ethPrice||0}"></div><div><label>Aportación semanal (€)</label><input id="weekly" type="number" value="${data.weekly}"></div><div><label>Objetivo (€)</label><input id="target" type="number" value="${data.target}"></div><div><label>Rentabilidad escenario (%)</label><input id="rate" type="number" step="0.1" value="${data.returnRate}"></div></div><br><button class="action" onclick="updateSettings()">Guardar</button></div><div class="card section"><h3>Privacidad y copia</h3><p class="muted">Los datos se guardan localmente en este dispositivo. Haz una copia manual de tus datos si cambias de dispositivo.</p><button class="action danger" onclick="resetData()">Restablecer datos</button></div></div>`}
function updateSettings(){data.accounts.remunerada=+rem.value;data.accounts.efectivo=+cash.value;data.crypto.eth=+eth.value;data.crypto.ethPrice=+ethprice.value;data.weekly=+weekly.value;data.target=+target.value;data.returnRate=+rate.value;save();setPage("dashboard")}
function resetData(){if(confirm('¿Restablecer todos los datos?')){data=structuredClone(defaults);save();setPage('dashboard')}}
function drawChart(canvas,items){if(!canvas||!items||!items.length)return;let ctx=canvas.getContext('2d'),d=devicePixelRatio||1,w=canvas.clientWidth*d,h=canvas.clientHeight*d;canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);let vals=items.map(x=>+x.value),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pad=28*d;ctx.font=`${12*d}px -apple-system`;ctx.strokeStyle='#d9dee5';ctx.lineWidth=1*d;for(let i=0;i<5;i++){let y=pad+(h-pad*1.5)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}ctx.strokeStyle='#1f6feb';ctx.lineWidth=3*d;ctx.beginPath();vals.forEach((v,i)=>{let x=pad+(w-pad*2)*i/Math.max(1,vals.length-1),y=h-pad-(v-min)/(max-min)*(h-pad*1.8);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#17202a';ctx.fillText(money(vals[vals.length-1]),pad,18*d)}
const pages=[['dashboard','Dashboard'],['cartera','Cartera'],['liquidez','Liquidez'],['evolucion','Evolución'],['aportaciones','Aportaciones'],['oportunidades','Oportunidades'],['objetivo','Objetivo 1 M€'],['decisiones','Decisiones'],['ajustes','Ajustes']];document.getElementById('nav').innerHTML=pages.map(([p,n])=>`<button data-p="${p}" onclick="setPage('${p}')">${n}</button>`).join('');if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});setPage('dashboard');
</script></body></html>
