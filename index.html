<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Patrimonio V2 · Centro de control</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#687385;--blue:#2563eb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e4e8ee;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:18px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:23px}header small{opacity:.72}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;position:sticky;top:67px;z-index:9;border-bottom:1px solid var(--border)}nav button{border:0;padding:10px 13px;border-radius:10px;font-weight:650;white-space:nowrap}nav button.active{background:var(--blue);color:#fff}main{max-width:1180px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.kpi{font-size:25px;font-weight:800;margin:5px 0}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#cbd5e1}.section{margin:16px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:11px 0}.row:last-child{border:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:700}.green{background:#e9f8ef;color:#167347}.red{background:#fdecec;color:#b52c2c}.amber{background:#fff7df;color:#8a5a00}.action{border:0;background:var(--blue);color:#fff;padding:10px 13px;border-radius:10px;font-weight:700}.secondary{background:#eef2f7;color:#17202a}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.progress,.bar{height:10px;background:#e9edf1;border-radius:99px;overflow:hidden}.progress>div,.bar>div{height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:13px}.right{text-align:right}.small{font-size:12px}.notice{padding:12px;background:#f7f9fc;border:1px solid var(--border);border-radius:12px}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--amber)}.score{font-size:22px;font-weight:800}.scroll{overflow:auto}.empty{text-align:center;padding:25px;color:var(--muted)}.danger{color:var(--red);border-color:#f0caca;background:#fff}.pill{display:flex;gap:7px;flex-wrap:wrap}.pill span{padding:6px 9px;border-radius:999px;background:#eef2f7;font-size:12px}</style></head><body><header><h1>Patrimonio V2</h1><small>Centro de control patrimonial · objetivo máximo patrimonio</small></header><nav id="nav"></nav><main id="app"></main><script src="market.js"></script><script>
const KEY='patrimonio_v4';
const seed=[["First Solar",2300,"Acción"],["BYD",1800,"Acción"],["Netflix",1800,"Acción"],["Meta",1900,"Acción"],["Apple",1400,"Acción"],["Palantir",1400,"Acción"],["Toyota",1300,"Acción"],["AMD",1800,"Acción"],["Nvidia",1700,"Acción"],["CaixaBank",1100,"Acción"],["S&P 500 ETF",600,"ETF"],["Amazon",598,"Acción"],["NextEra Energy",520,"Acción"],["MSCI World Acc",0,"ETF"]];
const initial={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:seed,decisions:[],contributions:[],radar:[],alerts:[],market:{lastSync:null,source:null}};
let data=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}})();
data.accounts=data.accounts||initial.accounts;data.crypto=data.crypto||initial.crypto;data.assets=data.assets||structuredClone(seed);data.decisions=data.decisions||[];data.contributions=data.contributions||[];data.radar=data.radar||[];data.alerts=data.alerts||[];data.market=data.market||{};data.weekly=Number(data.weekly||300);data.target=Number(data.target||1000000);data.returnRate=Number(data.returnRate||7);
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0),num=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:4}).format(Number(n)||0),pct=n=>((Number(n)||0)*100).toFixed(1)+'%',esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const assets=()=>data.assets, liq=()=>Number(data.accounts.remunerada||0)+Number(data.accounts.efectivo||0), manualInv=()=>assets().reduce((s,x)=>s+Number(x[1]||0),0);let I=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function getPos(n){const a=window.V4Portfolio?.positions||[];const aliases={Meta:'Meta Platforms',Palantir:'Palantir Technologies','S&P 500 ETF':'Vanguard S&P 500 Dist ETF','MSCI World Acc':'MSCI World Acc'};return a.find(p=>p.name.toLowerCase()===n.toLowerCase())||a.find(p=>p.name.toLowerCase()===(aliases[n]||'').toLowerCase())||null}
function total(){return I?.total??manualInv()+liq()+Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}
async function sync(){if(window.PortfolioIntelligenceV4){I=await PortfolioIntelligenceV4.build(data);if(I.eth.price)data.crypto.ethPrice=I.eth.price;data.market.lastSync=new Date().toLocaleString('es-ES');data.market.source='market-data + FX fallback';save()}render(current)}
function setPage(p){current=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));pages[p]();window.scrollTo(0,0)}let current='dashboard';
const navs=[['dashboard','🏠 Inicio'],['cartera','📊 Cartera'],['liquidez','💶 Liquidez'],['crypto','Ξ Crypto'],['objetivo','🎯 Objetivo'],['riesgo','⚖️ Riesgo'],['decision','🧠 Próximo euro'],['aportaciones','💰 Aportaciones'],['alertas','🚨 Alertas'],['radar','🔎 Radar'],['historial','📝 Historial'],['config','⚙️ Config']];document.getElementById('nav').innerHTML=navs.map(x=>`<button data-p="${x[0]}" onclick="setPage('${x[0]}')">${x[1]}</button>`).join('');
function allocation(){const t=total(),rows=[...(I?.rows||[]).map(r=>[r.name,r.valueEUR||0]),['Liquidez',liq()],['Ethereum',I?.eth?.valueEUR||Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return rows.map(x=>`<div class="row"><span><b>${esc(x[0])}</b><br><span class="muted">${money(x[1])}</span></span><span style="min-width:150px"><div class="bar"><div style="width:${Math.min(100,x[1]/Math.max(1,t)*100)}%"></div></div><span class="small">${pct(x[1]/Math.max(1,t))}</span></span></div>`).join('')}
const pages={
dashboard(){const t=total(),d=decisionData(),gap=Math.max(0,data.target-t);document.getElementById('app').innerHTML=`<div class="card hero"><span class="badge">MOTOR ÚNICO</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><p class="muted">${pct(t/data.target)} del objetivo de ${money(data.target)}</p><div class="progress"><div style="width:${Math.min(100,t/data.target*100)}%"></div></div><p class="small">Faltan ${money(gap)}</p></div><div class="grid section"><div class="card">Inversiones<div class="kpi">${money(I?.liveInvestment??manualInv())}</div></div><div class="card">Liquidez<div class="kpi">${money(liq())}</div><span>${pct(liq()/Math.max(1,t))}</span></div><div class="card">Ethereum<div class="kpi">${money(I?.eth?.valueEUR||0)}</div><span>${num(data.crypto.eth)} ETH · ${money(I?.eth?.price||data.crypto.ethPrice||0)}/ETH</span></div><div class="card">Aportación semanal<div class="kpi">${money(data.weekly)}</div><span>${money(data.weekly*52)}/año</span></div></div><div class="two section"><div class="card"><h3>¿Dónde pongo el próximo euro?</h3><span class="badge green">${esc(d.action)}</span><h3>${esc(d.asset||'Esperar')}</h3><p>${esc(d.reason)}</p><div class="score">${d.score}/100</div></div><div class="card"><h3>Calidad de datos</h3><div class="pill"><span>Live: ${I?.quality?.live||0}</span><span>Revisión: ${I?.quality?.review||0}</span><span>Pendiente: ${I?.quality?.pending||0}</span></div><p class="muted">${data.market.lastSync||'Sin sincronización'}</p><button class="action" onclick="sync()">Actualizar precios</button></div></div><div class="card"><h3>Asignación patrimonial</h3>${allocation()}</div>`},
cartera(){const rows=I?.rows||[];document.getElementById('app').innerHTML=`<h2>Cartera completa</h2><div class="card scroll"><table><thead><tr><th>Activo</th><th>Cantidad</th><th>Precio medio</th><th>Actual</th><th class="right">Valor €</th><th class="right">P/L</th><th>Estado</th></tr></thead><tbody>${assets().map(a=>{const r=rows.find(z=>z.name.toLowerCase()===a[0].toLowerCase()),p=getPos(a[0]);return `<tr><td><b>${esc(a[0])}</b><br><span class="muted">${esc(a[2])}</span></td><td>${p?num(p.quantity):'—'}</td><td>${p?num(p.averageCost)+' '+p.currency:'—'}</td><td>${r?.quote!=null?num(r.quote)+' '+r.currency:'—'}</td><td class="right"><b>${money(r?.valueEUR??a[1])}</b></td><td class="right ${r?.gainEUR>=0?'positive':'negative'}">${r?.gainEUR!=null?money(r.gainEUR)+'<br>'+pct(r.returnPct):'—'}</td><td><span class="badge ${r?.status==='live-price'?'green':r?.status==='review-quantity'?'amber':'red'}">${r?.status||'manual'}</span></td></tr>`}).join('')}</tbody></table></div><div class="card section"><h3>Ajuste manual</h3><div class="form"><label>Activo<input id="an" placeholder="Toyota"></label><label>Valor €<input id="av" type="number"></label><label>Tipo<select id="at"><option>Acción</option><option>ETF</option><option>Fondo</option><option>Otro</option></select></label></div><br><button class="action" onclick="assetSave()">Guardar posición</button></div>`},
liquidez(){document.getElementById('app').innerHTML=`<h2>Liquidez</h2><div class="grid"><div class="card">Remunerada<div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card">Efectivo<div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card">Total<div class="kpi">${money(liq())}</div></div></div><div class="card section"><h3>Distribución</h3><p>Liquidez / patrimonio: <b>${pct(liq()/Math.max(1,total()))}</b></p><p>Objetivo de reserva y liquidez se mantienen separados de la inversión.</p></div>`},
crypto(){const p=I?.eth?.price||data.crypto.ethPrice||0,v=I?.eth?.valueEUR||Number(data.crypto.eth)*p;document.getElementById('app').innerHTML=`<h2>Ethereum</h2><div class="grid"><div class="card">Cantidad<div class="kpi">${num(data.crypto.eth)} ETH</div></div><div class="card">Precio<div class="kpi">${money(p)}</div></div><div class="card">Valor<div class="kpi">${money(v)}</div></div><div class="card">Peso<div class="kpi">${pct(v/Math.max(1,total()))}</div></div></div><div class="card section"><h3>Actualizar cantidad</h3><input id="ethq" type="number" step="0.0001" value="${data.crypto.eth}"><br><br><button class="action" onclick="data.crypto.eth=Number(document.getElementById('ethq').value);save();sync()">Guardar</button></div>`},
objetivo(){const t=total(),annual=data.weekly*52,gap=Math.max(0,data.target-t);const years=r=>{let v=t,y=0;while(v<data.target&&y<80){v=v*(1+r)+annual;y++}return y<80?y+' años':'>80 años'};document.getElementById('app').innerHTML=`<h2>Objetivo máximo</h2><div class="card hero"><div class="kpi">${pct(t/data.target)}</div><p>Patrimonio ${money(t)} · objetivo ${money(data.target)}</p><p>Faltan ${money(gap)}</p></div><div class="grid section"><div class="card">Aportación anual<div class="kpi">${money(annual)}</div></div><div class="card">4%<div class="kpi">${years(.04)}</div></div><div class="card">7%<div class="kpi">${years(.07)}</div></div><div class="card">10%<div class="kpi">${years(.10)}</div></div></div><div class="notice">Proyecciones matemáticas, no garantía de rentabilidad.</div>`},
riesgo(){const t=total(),rows=[...(I?.rows||[])].sort((a,b)=>(b.valueEUR||0)-(a.valueEUR||0));const top=rows[0];document.getElementById('app').innerHTML=`<h2>Riesgo y concentración</h2><div class="grid"><div class="card">Mayor posición<div class="kpi">${esc(top?.name||'—')}</div><span>${pct((top?.valueEUR||0)/Math.max(1,t))}</span></div><div class="card">Liquidez<div class="kpi">${pct(liq()/Math.max(1,t))}</div></div><div class="card">ETH<div class="kpi">${pct((I?.eth?.valueEUR||0)/Math.max(1,t))}</div></div></div><div class="card section">${rows.map(r=>`<div class="row"><span>${esc(r.name)}</span><b>${pct((r.valueEUR||0)/Math.max(1,t))}</b></div>`).join('')}</div>`},
decision(){const d=decisionData();document.getElementById('app').innerHTML=`<h2>¿Dónde pongo el próximo euro?</h2><div class="card hero"><span class="badge green">${esc(d.action)}</span><div class="kpi">${esc(d.asset||'Esperar')}</div><p>${esc(d.reason)}</p><div class="score">${d.score}/100</div></div><div class="card section"><h3>Regla</h3><p>Prioridad al núcleo cuando está infraponderado; evitar aumentar concentraciones excesivas; si faltan datos fiables, esperar.</p><button class="action" onclick="recordDecision()">Registrar decisión</button></div>`},
aportaciones(){document.getElementById('app').innerHTML=`<h2>Aportaciones</h2><div class="grid"><div class="card">Semanal<div class="kpi">${money(data.weekly)}</div></div><div class="card">Anual<div class="kpi">${money(data.weekly*52)}</div></div><div class="card">Registradas<div class="kpi">${data.contributions.length}</div></div></div><div class="card section"><button class="action" onclick="addContribution()">Registrar aportación semanal</button></div><div class="card section">${data.contributions.slice().reverse().map(x=>`<div class="row"><span>${esc(x.date)}</span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">Aún no hay aportaciones registradas.</div>'}</div>`},
alertas(){document.getElementById('app').innerHTML=`<h2>Alertas y precios objetivo</h2><div class="card"><div class="form"><label>Activo<input id="alertAsset" placeholder="MSCI World Acc"></label><label>Precio objetivo €<input id="alertPrice" type="number" step="0.01"></label><label>Tipo<select id="alertType"><option>Comprar si llega</option><option>Revisar</option></select></label></div><br><button class="action" onclick="addAlert()">Añadir alerta</button></div><div class="card section">${data.alerts.map((a,i)=>`<div class="row"><span><b>${esc(a.asset)}</b><br><span class="muted">${esc(a.type)} · ${money(a.price)}</span></span><button class="action secondary" onclick="data.alerts.splice(${i},1);save();render('alertas')">Eliminar</button></div>`).join('')||'<div class="empty">Sin alertas.</div>'}</div>`},
radar(){const rows=(I?.rows||[]).filter(r=>r.status==='live-price').sort((a,b)=>(b.score||0)-(a.score||0));document.getElementById('app').innerHTML=`<h2>Radar de oportunidades</h2><div class="card">${rows.map(r=>`<div class="row"><span><b>${esc(r.name)}</b><br><span class="muted">Peso ${pct(r.weight||0)}</span></span><span class="score">${r.score||0}</span></div>`).join('')||'<div class="empty">Sin datos suficientes.</div>'}</div>`},
historial(){document.getElementById('app').innerHTML=`<h2>Historial de decisiones</h2><div class="card">${data.decisions.slice().reverse().map(x=>`<div class="row"><span><b>${esc(x.action)}</b> · ${esc(x.asset||'')}</span><span class="muted">${esc(x.date)}</span></div>`).join('')||'<div class="empty">Aún no hay decisiones.</div>'}</div>`},
config(){document.getElementById('app').innerHTML=`<h2>Configuración</h2><div class="card"><div class="form"><label>Cuenta remunerada €<input id="rem" type="number" value="${data.accounts.remunerada}"></label><label>Efectivo €<input id="cash" type="number" value="${data.accounts.efectivo}"></label><label>Aportación semanal €<input id="week" type="number" value="${data.weekly}"></label><label>Objetivo €<input id="target" type="number" value="${data.target}"></label><label>Rentabilidad base %<input id="rate" type="number" value="${data.returnRate}"></label></div><br><button class="action" onclick="saveConfig()">Guardar configuración</button></div><div class="card section"><h3>Estado</h3><p>Última sincronización: ${data.market.lastSync||'—'}</p><p>Fuente: ${data.market.source||'—'}</p><button class="action secondary" onclick="sync()">Forzar actualización</button></div>`}}
function decisionData(){if(I?.nextEuro?.asset)return I.nextEuro;const t=total(),l=liq(),core=(I?.rows||[]).find(r=>r.core);if(l/Math.max(1,t)>.65)return{action:'ACUMULAR',asset:'MSCI World Acc',score:80,reason:'Hay mucha liquidez: invertir de forma escalonada sin comprometer el colchón.'};return{action:'MANTENER',asset:core?.name||'MSCI World Acc',score:60,reason:'Mantener disciplina y evitar decisiones impulsivas.'}}
function assetSave(){const n=document.getElementById('an').value.trim(),v=Number(document.getElementById('av').value),ty=document.getElementById('at').value;if(!n||!v)return;const x=data.assets.find(a=>a[0].toLowerCase()===n.toLowerCase());if(x)x[1]=v;else data.assets.push([n,v,ty]);save();sync()}
function addContribution(){data.contributions.push({date:new Date().toLocaleDateString('es-ES'),amount:data.weekly});save();render('aportaciones')}
function addAlert(){const asset=document.getElementById('alertAsset').value.trim(),price=Number(document.getElementById('alertPrice').value),type=document.getElementById('alertType').value;if(asset&&price)data.alerts.push({asset,price,type});save();render('alertas')}
function recordDecision(){const d=decisionData();data.decisions.push({date:new Date().toLocaleString('es-ES'),action:d.action,asset:d.asset,score:d.score});save();render('historial')}
function saveConfig(){data.accounts.remunerada=Number(document.getElementById('rem').value);data.accounts.efectivo=Number(document.getElementById('cash').value);data.weekly=Number(document.getElementById('week').value);data.target=Number(document.getElementById('target').value);data.returnRate=Number(document.getElementById('rate').value);save();sync()}
function render(p){if(pages[p])pages[p]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p))}
document.addEventListener('DOMContentLoaded',async()=>{render('dashboard');await sync()});
</script></body></html>
