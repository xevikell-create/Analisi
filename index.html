<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrimonio V2</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#1f6feb;--green:#159957;--red:#d64545;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#111827;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.7}
nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:67px;z-index:4}
nav button{border:0;background:#eef2f7;padding:10px 14px;border-radius:10px;white-space:nowrap}nav button.active{background:var(--accent);color:#fff}
main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.kpi{font-size:25px;font-weight:750;margin-top:7px}.muted{color:var(--muted);font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}
h2{margin-top:8px}.section{margin:20px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.row:last-child{border-bottom:0}
button.action{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 13px}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
#app{min-height:70vh}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:600}
.hidden{display:none}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.hero .muted{color:#cbd5e1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);font-size:14px}
</style>
</head>
<body>
<header><h1>Patrimonio V2</h1><small>Centro de control patrimonial · Objetivo: máximo patrimonio</small></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const KEY="patrimonio_v2";
const defaultData={
 accounts:{remunerada:64480, efectivo:27000},
 crypto:{eth:1.1},
 weekly:300,
 target:1000000,
 assets:[
  ["First Solar",2300],["BYD",1800],["Netflix",1800],["Meta",1900],["Apple",1400],
  ["Palantir",1400],["Toyota",1300],["AMD",1800],["Nvidia",1700],["CaixaBank",1100],
  ["S&P 500 ETF",600],["Amazon",598],["NextEra Energy",520],["MSCI World Acc",0]
 ],
 decisions:[]
};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaultData;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function invested(){return data.assets.reduce((a,x)=>a+Number(x[1]),0)}
function total(){return invested()+data.accounts.remunerada+data.accounts.efectivo}
function money(n){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n)}
function pct(n){return (n*100).toFixed(1)+"%"}
function setPage(p){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));
 const app=document.getElementById("app");
 if(p==="dashboard") dashboard(app);
 if(p==="cartera") cartera(app);
 if(p==="liquidez") liquidez(app);
 if(p==="objetivo") objetivo(app);
 if(p==="decisiones") decisiones(app);
 if(p==="ajustes") ajustes(app);
}
function dashboard(a){
 const t=total(), inv=invested(), liquid=data.accounts.remunerada+data.accounts.efectivo;
 a.innerHTML=`<div class="section"><div class="card hero"><span class="badge">CONTROL PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><div class="muted">Objetivo ${money(data.target)} · ${pct(t/data.target)} alcanzado</div></div></div>
 <div class="grid">
 <div class="card"><div class="muted">Invertido</div><div class="kpi">${money(inv)}</div></div>
 <div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(liquid)}</div></div>
 <div class="card"><div class="muted">Aportación semanal</div><div class="kpi">${money(data.weekly)}</div></div>
 <div class="card"><div class="muted">Ethereum</div><div class="kpi">${data.crypto.eth} ETH</div></div>
 </div>
 <div class="section grid">
 <div class="card"><h3>¿Dónde pongo el próximo euro?</h3><p>Prioridad actual: <b>MSCI World Acc</b></p><p class="muted">Mantener la aportación automática de ${money(data.weekly)}/semana y reservar liquidez para oportunidades claras.</p></div>
 <div class="card"><h3>Decisión semanal</h3><span class="badge">MANTENER ESTRATEGIA</span><p class="muted">Revisar posiciones individuales antes de reforzar. El núcleo sigue siendo el MSCI World Acc.</p></div>
 </div>`;
}
function cartera(a){
 a.innerHTML=`<div class="section"><h2>Cartera completa</h2><div class="card"><table><thead><tr><th>Activo</th><th>Valor</th><th>Peso</th></tr></thead><tbody>
 ${data.assets.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${pct(Number(x[1])/Math.max(1,invested()))}</td></tr>`).join("")}
 </tbody></table></div></div>`;
}
function liquidez(a){
 a.innerHTML=`<div class="section"><h2>Liquidez</h2><div class="grid">
 <div class="card"><div class="muted">Cuenta remunerada</div><div class="kpi">${money(data.accounts.remunerada)}</div></div>
 <div class="card"><div class="muted">Efectivo</div><div class="kpi">${money(data.accounts.efectivo)}</div></div>
 <div class="card"><div class="muted">Liquidez total</div><div class="kpi">${money(data.accounts.remunerada+data.accounts.efectivo)}</div></div>
 </div><div class="card section"><h3>Regla operativa</h3><p>No invertir toda la liquidez de golpe. Mantener colchón y utilizar entradas escalonadas cuando haya oportunidades.</p></div></div>`;
}
function objetivo(a){
 const t=total(), gap=Math.max(0,data.target-t);
 a.innerHTML=`<div class="section"><h2>Objetivo patrimonial</h2><div class="card hero"><div class="muted">Progreso hacia ${money(data.target)}</div><div class="kpi">${pct(t/data.target)}</div><p>${money(gap)} para alcanzar el objetivo.</p></div>
 <div class="card section"><h3>Motor de crecimiento</h3><p>Aportación automática: <b>${money(data.weekly)}/semana</b> · ${money(data.weekly*52)}/año.</p><p class="muted">La proyección exacta debe actualizarse con rentabilidad y aportaciones reales.</p></div></div>`;
}
function decisiones(a){
 a.innerHTML=`<div class="section"><h2>Decisiones</h2><div class="card"><div class="form"><div><label>Activo</label><input id="dasset" placeholder="Ej. Meta"></div><div><label>Decisión</label><select id="dtype"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div></div><br><button class="action" onclick="addDecision()">Guardar decisión</button></div>
 <div class="card section">${data.decisions.length?data.decisions.map(d=>`<div class="row"><span><b>${d.asset}</b><br><span class="muted">${d.date}</span></span><span class="badge">${d.type}</span></div>`).join(""):"Sin decisiones registradas todavía."}</div></div>`;
}
function addDecision(){let asset=document.getElementById("dasset").value.trim();if(!asset)return;data.decisions.unshift({asset,type:document.getElementById("dtype").value,date:new Date().toLocaleDateString("es-ES")});save();setPage("decisiones")}
function ajustes(a){
 a.innerHTML=`<div class="section"><h2>Ajustes</h2><div class="card"><div class="form">
 <div><label>Cuenta remunerada (€)</label><input id="rem" type="number" value="${data.accounts.remunerada}"></div>
 <div><label>Efectivo (€)</label><input id="cash" type="number" value="${data.accounts.efectivo}"></div>
 <div><label>ETH</label><input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div>
 <div><label>Aportación semanal (€)</label><input id="weekly" type="number" value="${data.weekly}"></div>
 <div><label>Objetivo (€)</label><input id="target" type="number" value="${data.target}"></div>
 </div><br><button class="action" onclick="updateSettings()">Guardar</button></div></div>`;
}
function updateSettings(){data.accounts.remunerada=+rem.value;data.accounts.efectivo=+cash.value;data.crypto.eth=+eth.value;data.weekly=+weekly.value;data.target=+target.value;save();setPage("dashboard")}
const pages=[["dashboard","Dashboard"],["cartera","Cartera"],["liquidez","Liquidez"],["objetivo","Objetivo 1 M€"],["decisiones","Decisiones"],["ajustes","Ajustes"]];
document.getElementById("nav").innerHTML=pages.map(([p,n])=>`<button data-p="${p}" onclick="setPage('${p}')">${n}</button>`).join("");
setPage("dashboard");
</script>
</body></html>
