<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Patrimonio V2 · Centro de control</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#687385;--blue:#2563eb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e4e8ee;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:18px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:23px}header small{opacity:.72}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;position:sticky;top:67px;z-index:9;border-bottom:1px solid var(--border)}nav button{border:0;padding:10px 13px;border-radius:10px;font-weight:650;white-space:nowrap}nav button.active{background:var(--blue);color:#fff}main{max-width:1180px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.kpi{font-size:25px;font-weight:800;margin:5px 0}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#cbd5e1}.section{margin:16px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:11px 0}.row:last-child{border:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:700}.green{background:#e9f8ef;color:#167347}.red{background:#fdecec;color:#b52c2c}.amber{background:#fff7df;color:#8a5a00}.action{border:0;background:var(--blue);color:#fff;padding:10px 13px;border-radius:10px;font-weight:700}.secondary{background:#eef2f7;color:#17202a}.danger{background:#fff;color:var(--red);border:1px solid #f0caca}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.progress,.bar{height:10px;background:#e9edf1;border-radius:99px;overflow:hidden}.progress>div,.bar>div{height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:13px}.right{text-align:right}.small{font-size:12px}.notice{padding:12px;background:#f7f9fc;border:1px solid var(--border);border-radius:12px}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--amber)}.score{font-size:22px;font-weight:800}.scroll{overflow:auto}.empty{text-align:center;padding:25px;color:var(--muted)}
</style></head>
<body>
<header><h1>Patrimonio V2</h1><small>Centro de control patrimonial · Objetivo máximo patrimonio</small></header>
<nav id="nav"></nav><main id="app"></main>
<script src="market.js"></script>
<script>
const KEY='patrimonio_v4';
const seed=[["First Solar",2300,"Acción"],["BYD",1800,"Acción"],["Netflix",1800,"Acción"],["Meta",1900,"Acción"],["Apple",1400,"Acción"],["Palantir",1400,"Acción"],["Toyota",1300,"Acción"],["AMD",1800,"Acción"],["Nvidia",1700,"Acción"],["CaixaBank",1100,"Acción"],["S&P 500 ETF",600,"ETF"],["Amazon",598,"Acción"],["NextEra Energy",520,"Acción"],["MSCI World Acc",0,"ETF"]];
const initial={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:seed,decisions:[],contributions:[],radar:[],alerts:[],market:{lastSync:null,source:null}};
let data=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}})();
data.accounts=data.accounts||initial.accounts;data.crypto=data.crypto||initial.crypto;data.assets=data.assets||structuredClone(seed);data.decisions=data.decisions||[];data.contributions=data.contributions||[];data.radar=data.radar||[];data.alerts=data.alerts||[];data.market=data.market||{};data.weekly=Number(data.weekly||300);data.target=Number(data.target||1000000);data.returnRate=Number(data.returnRate||7);
const meta=window.V4Portfolio?.positions||[];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function A(){return data.assets}function find(n){return A().find(x=>x[0].toLowerCase()===n.toLowerCase())}function qtyMeta(n){return meta.find(x=>x.name.toLowerCase()===n.toLowerCase())||meta.find(x=>x.name.toLowerCase()===({Meta:'Meta Platforms',Palantir:'Palantir Technologies','S&P 500 ETF':'Vanguard S&P 500 Dist ETF','MSCI World Acc':'MSCI World Acc'}[n]||'').toLowerCase())||{}}
function inv(){return A().reduce((s,x)=>s+Number(x[1]||0),0)}function liq(){return Number(data.accounts.remunerada||0)+Number(data.accounts.efectivo||0)}function ethValue(){return Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}function total(){return inv()+liq()+ethValue()}function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0)}function priceMoney(n,c){return new Intl.NumberFormat('es-ES',{style:'currency',currency:c||'EUR',maximumFractionDigits:2}).format(Number(n)||0)}function pct(n){return ((Number(n)||0)*100).toFixed(1)+'%'}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function live(){return window.__V4_INTELLIGENCE__||null}
function decision(){let t=total(),l=liq(),core=find('MSCI World Acc'),cv=core?Number(core[1]):0;if(!t)return['EMPEZAR','amber','Introduce los datos patrimoniales.'];if(l/t>.65)return['ACUMULAR','green','Hay mucha liquidez: invertir de forma escalonada sin comprometer el colchón.'];if(cv/Math.max(1,inv())<.30)return['REFORZAR NÚCLEO','green','El MSCI World todavía pesa poco frente a la cartera: es el núcleo estratégico.'];return['MANTENER','green','Mantener la disciplina de aportaciones y esperar oportunidades con margen.']}
function allocation(){let t=total();return [...A().map(x=>[x[0],Number(x[1])]),['Liquidez',liq()],['Ethereum',ethValue()]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><span>${esc(x[0])}<br><span class="muted">${money(x[1])}</span></span><span style="min-width:150px"><div class="bar"><div style="width:${Math.min(100,x[1]/Math.max(1,t)*100)}%"></div></div><span class="small">${pct(x[1]/Math.max(1,t))}</span></span></div>`).join('')}
function nav(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));pages[p](document.getElementById('app'));window.scrollTo({top:0,behavior:'smooth'})}
const pages={
 dashboard(a){let t=total(),d=decision(),gap=Math.max(0,data.target-t),i=live();a.innerHTML=`<div class="card hero"><span class="badge">V2 · MOTOR PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(i?.total||t)}</div><p class="muted">${pct((i?.total||t)/data.target)} del objetivo de ${money(data.target)}</p><div class="progress"><div style="width:${Math.min(100,(i?.total||t)/data.target*100)}%"></div></div><p class="small">Faltan ${money(gap)}</p></div><div class="grid section"><div class="card"><span class="muted">Inversiones</span><div class="kpi">${money(i?.liveInvestment||inv())}</div><span class="small">Valoración de mercado</span></div><div class="card"><span class="muted">Liquidez</span><div class="kpi">${money(liq())}</div><span class="small">${pct(liq()/Math.max(1,i?.total||t))}</span></div><div class="card"><span class="muted">Ethereum</span><div class="kpi">${money(i?.eth?.valueEUR||ethValue())}</div><span class="small">${Number(data.crypto.eth||0).toLocaleString('es-ES',{maximumFractionDigits:4})} ETH</span></div><div class="card"><span class="muted">Aportación semanal</span><div class="kpi">${money(data.weekly)}</div><span class="small">${money(data.weekly*52)}/año</span></div></div><div class="two section"><div class="card"><h3>¿Dónde pongo el próximo euro?</h3>${i?.nextEuro?.asset?`<span class="badge green">${esc(i.nextEuro.action)}</span><h3>${esc(i.nextEuro.asset)}</h3><p>${esc(i.nextEuro.reason)}</p><div class="score">${i.nextEuro.score}/100</div>`:`<span class="badge ${d[1]}">${d[0]}</span><p>${d[2]}</p>`}<button class="action" onclick="aporte()">Registrar ${money(data.weekly)}</button></div><div class="card"><h3>Estado de mercado</h3><p class="muted">${data.market.lastSync||'Sin sincronización manual'}</p><p>${data.market.source||'Pendiente'}</p><button class="action" onclick="syncMarket()">Actualizar precios</button></div></div><div class="card"><h3>Asignación patrimonial</h3>${allocation()}</div>`},
 cartera(a){let i=live(),rows=i?.rows||[];a.innerHTML=`<h2>Cartera completa</h2><div class="card scroll"><table><thead><tr><th>Activo</th><th>Cantidad</th><th>Precio medio</th><th>Actual</th><th class="right">Valor €</th><th class="right">P/L</th><th class="right">Peso</th></tr></thead><tbody>${A().map(x=>{let r=rows.find(z=>z.name.toLowerCase()===x[0].toLowerCase());let m=qtyMeta(x[0]);return `<tr><td><b>${esc(x[0])}</b><br><span class="muted">${esc(x[2])}</span></td><td>${m.quantity?Number(m.quantity).toLocaleString('es-ES',{maximumFractionDigits:4}):'—'}</td><td>${m.averageCost?priceMoney(m.averageCost,m.currency):'—'}</td><td>${r?.quote!=null?priceMoney(r.quote,r.currency):'—'}</td><td class="right"><b>${r?.valueEUR!=null?money(r.valueEUR):money(x[1])}</b></td><td class="right ${r?.gainEUR>=0?'positive':'negative'}">${r?.gainEUR!=null?money(r.gainEUR)+'<br>'+pct(r.returnPct):'Pendiente'}</td><td class="right">${r?.weight!=null?pct(r.weight):pct(Number(x[1])/Math.max(1,total()))}</td></tr>`}).join('')}</tbody></table></div><div class="notice section">Los importes introducidos manualmente se conservan como respaldo. Cuando existe cantidad + precio + FX fiables, la valoración de mercado pasa a ser la principal.</div><div class="card section"><h3>Actualizar posición manualmente</h3><div class="form"><div>Activo<input id="an" placeholder="Nvidia"></div><div>Valor (€)<input id="av" type="number"></div><div>Tipo<select id="at"><option>Acción</option><option>ETF</option><option>Fondo</option><option>Otro</option></select></div></div><br><button class="action" onclick="assetSave()">Guardar</button></div>`},
 liquidez(a){a.innerHTML=`<h2>Liquidez</h2><div class="grid"><div class="card">Cuenta remunerada<div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card">Efectivo<div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card">Total<div class="kpi">${money(liq())}</div></div></div><div class="card section"><h3>Control de liquidez</h3><p>Liquidez sobre patrimonio: <b>${pct(liq()/Math.max(1,total()))}</b></p><p class="muted">El motor separa colchón de seguridad, efectivo e inversión.</p></div>`},
 objetivo(a){let t=total(),annual=data.weekly*52;function years(r){let v=t,y=0;while(v<data.target&&y<70){v=v*(1+r)+annual;y++}return y<70?y+' años':'>70 años'}a.innerHTML=`<h2>Objetivo 1 M€</h2><div class="card hero"><div class="kpi">${pct(t/data.target)}</div><p>Faltan ${money(Math.max(0,data.target-t))}</p></div><div class="grid section"><div class="card">Aportación anual<div class="kpi">${money(annual)}</div></div><div class="card">Rentabilidad base<div class="kpi">${data.returnRate}%</div></div><div class="card">4%<div class="kpi">${years(.04)}</div></div><div class="card">7%<div class="kpi">${years(.07)}</div></div><div class="card">10%<div class="kpi">${years(.10)}</div></div></div><div class="notice">Proyección matemática, no garantía de rentabilidad.</div>`},
 riesgo(a){let t=total(),rows=A().map(x=>[x[0],Number(x[1])]).sort((x,y)=>y[1]-x[1]),top=rows[0]||['—',0],i=live();a.innerHTML=`<h2>Riesgo y concentración</h2><div class="grid"><div class="card">Mayor posición<div class="kpi">${esc(top[0])}</div><span>${pct(top[1]/Math.max(1,t))} del patrimonio</span></div><div class="card">Liquidez<div class="kpi">${pct(liq()/Math.max(1,t))}</div></div><div class="card">ETH<div class="kpi">${pct((i?.eth?.valueEUR||ethValue())/Math.max(1,t))}</div></div></div><div class="card section"><h3>Concentración</h3>${rows.slice(0,10).map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${pct(x[1]/Math.max(1,t))}</b></div>`).join('')}<p class="muted">El siguiente nivel del motor es incorporar drawdown y volatilidad histórica para afinar las señales.</p></div>`},
 decisiones(a){a.innerHTML=`<h2>Decisiones</h2><div class="card"><div class="form"><div>Activo<input id="da"></div><div>Decisión<select id="dt"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div><div>Motivo<input id="dr"></div></div><br><button class="action" onclick="decSave()">Guardar decisión</button></div><div class="card section">${data.decisions.map(x=>`<div class="row"><span><b>${esc(x.asset)}</b><br><span class="muted">${esc(x.reason)} · ${esc(x.date)}</span></span><span class="badge">${esc(x.type)}</span></div>`).join('')||'<div class="empty">Sin decisiones todavía.</div>'}</div>`},
 radar(a){a.innerHTML=`<h2>Radar de oportunidades</h2><div class="card"><div class="form"><div>Activo<input id="ra"></div><div>Precio actual<input id="rp" type="number"></div><div>Precio objetivo<input id="rt" type="number"></div><div>Tesis<input id="rx"></div></div><br><button class="action" onclick="radarSave()">Añadir</button></div><div class="card section">${data.radar.map(x=>`<div class="row"><span><b>${esc(x.asset)}</b><br><span class="muted">${esc(x.thesis)}</span></span><b>${x.price&&x.target?pct(x.target/x.price-1):'—'}</b></div>`).join('')||'<div class="empty">Radar vacío.</div>'}</div>`},
 historial(a){a.innerHTML=`<h2>Historial</h2><div class="grid"><div class="card">Aportado registrado<div class="kpi">${money(data.contributions.reduce((s,x)=>s+Number(x.amount||0),0))}</div></div><div class="card">Decisiones<div class="kpi">${data.decisions.length}</div></div><div class="card">Aportación semanal<div class="kpi">${money(data.weekly)}</div></div></div><div class="card section">${data.contributions.map(x=>`<div class="row"><span>${esc(x.asset)}<br><span class="muted">${esc(x.date)}</span></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">Sin aportaciones registradas.</div>'}</div>`},
 ajustes(a){a.innerHTML=`<h2>Ajustes</h2><div class="card"><div class="form"><div>Remunerada<input id="rem" type="number" value="${data.accounts.remunerada}"></div><div>Efectivo<input id="cash" type="number" value="${data.accounts.efectivo}"></div><div>ETH<input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div><div>Precio ETH<input id="ep" type="number" value="${data.crypto.ethPrice}"></div><div>Aportación semanal<input id="wk" type="number" value="${data.weekly}"></div><div>Objetivo<input id="tg" type="number" value="${data.target}"></div><div>Rentabilidad anual<input id="rr" type="number" step=".1" value="${data.returnRate}"></div></div><br><button class="action" onclick="settingsSave()">Guardar</button></div><div class="notice section">Las claves de proveedores no son necesarias para ETH: se usa CoinGecko. Las cotizaciones de acciones dependen de las fuentes disponibles en <code>market.js</code>.</div>`}
};
function aporte(){let f=find('MSCI World Acc');if(f)f[1]=Number(f[1])+data.weekly;else data.assets.push(['MSCI World Acc',data.weekly,'ETF']);data.contributions.unshift({date:new Date().toLocaleDateString('es-ES'),amount:Number(data.weekly),asset:'MSCI World Acc'});save();nav('historial')}
function assetSave(){let n=an.value.trim(),v=Number(av.value);if(!n||!Number.isFinite(v))return;let f=find(n);if(f){f[1]=v;f[2]=at.value}else data.assets.push([n,v,at.value]);save();nav('cartera')}
function decSave(){if(!da.value.trim())return;data.decisions.unshift({asset:da.value.trim(),type:dt.value,reason:dr.value.trim(),date:new Date().toLocaleDateString('es-ES')});save();nav('decisiones')}
function radarSave(){if(!ra.value.trim())return;data.radar.unshift({asset:ra.value.trim(),price:Number(rp.value),target:Number(rt.value),thesis:rx.value.trim()});save();nav('radar')}
function settingsSave(){data.accounts.remunerada=Number(rem.value);data.accounts.efectivo=Number(cash.value);data.crypto.eth=Number(eth.value);data.crypto.ethPrice=Number(ep.value);data.weekly=Number(wk.value);data.target=Number(tg.value);data.returnRate=Number(rr.value);save();nav('dashboard')}
async function syncMarket(){try{if(window.MarketV4){let r=await MarketV4.sync(data);if(r.ethPrice)data.crypto.ethPrice=r.ethPrice;data.market.lastSync=new Date().toLocaleString('es-ES');data.market.source=r.source||'market';save();if(window.PortfolioIntelligenceV4)window.__V4_INTELLIGENCE__=await PortfolioIntelligenceV4.build(data);nav('dashboard')}}catch(e){alert('No se pudo actualizar el mercado: '+e.message)}}
const menu=[['dashboard','Dashboard'],['cartera','Cartera'],['liquidez','Liquidez'],['objetivo','Objetivo 1 M€'],['riesgo','Riesgo'],['decisiones','Decisiones'],['radar','Radar'],['historial','Historial'],['ajustes','Ajustes']];document.getElementById('nav').innerHTML=menu.map(x=>`<button data-p="${x[0]}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('');
(async()=>{try{if(window.PortfolioIntelligenceV4)window.__V4_INTELLIGENCE__=await PortfolioIntelligenceV4.build(data)}catch(e){}nav('dashboard')})();
</script></body></html>
