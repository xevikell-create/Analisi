<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Patrimonio V2 · Centro de control</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#687385;--blue:#2563eb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e4e8ee;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:23px}header small{opacity:.72}.privacy-btn{border:1px solid #ffffff55;background:#ffffff18;color:#fff;padding:9px 12px;border-radius:10px;font-weight:700;white-space:nowrap}.private-mode .sensitive{filter:blur(7px);user-select:none}.private-mode .sensitive::selection{background:transparent}.private-mode .sensitive-text{font-size:0}.private-mode .sensitive-text::after{content:'••••••';font-size:inherit}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;position:sticky;top:67px;z-index:9;border-bottom:1px solid var(--border)}nav button{border:0;padding:10px 13px;border-radius:10px;font-weight:650;white-space:nowrap}nav button.active{background:var(--blue);color:#fff}main{max-width:1180px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.kpi{font-size:25px;font-weight:800;margin:5px 0}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#cbd5e1}.section{margin:16px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:11px 0}.row:last-child{border:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:700}.green{background:#e9f8ef;color:#167347}.red{background:#fdecec;color:#b52c2c}.amber{background:#fff7df;color:#8a5a00}.action{border:0;background:var(--blue);color:#fff;padding:10px 13px;border-radius:10px;font-weight:700}.secondary{background:#eef2f7;color:#17202a}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.progress,.bar{height:10px;background:#e9edf1;border-radius:99px;overflow:hidden}.progress>div,.bar>div{height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:13px}.right{text-align:right}.small{font-size:12px}.notice{padding:12px;background:#f7f9fc;border:1px solid var(--border);border-radius:12px}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--amber)}.score{font-size:22px;font-weight:800}.scroll{overflow:auto}.empty{text-align:center;padding:25px;color:var(--muted)}.danger{color:var(--red);border-color:#f0caca;background:#fff}.pill{display:flex;gap:7px;flex-wrap:wrap}.pill span{padding:6px 9px;border-radius:999px;background:#eef2f7;font-size:12px}</style></head><body><header><div><h1>Patrimonio V2</h1><small>Centro de control patrimonial · objetivo máximo patrimonio</small></div><div style="display:flex;gap:7px;align-items:center"><button id="refreshPricesBtn" class="privacy-btn" onclick="refreshPrices()">🔄 Actualizar precios</button><button id="privacyBtn" class="privacy-btn" onclick="togglePrivate()">👁️ Modo privado</button></div></header><nav id="nav"></nav><main id="app"></main><script src="market.js"></script><script>
const KEY='patrimonio_v4',PRIVATE_KEY='patrimonio_private_mode';
let privateMode=localStorage.getItem(PRIVATE_KEY)==='1';
function applyPrivate(){document.body.classList.toggle('private-mode',privateMode);const b=document.getElementById('privacyBtn');if(b)b.textContent=privateMode?'🙈 Mostrar cifras':'👁️ Modo privado'}
function togglePrivate(){privateMode=!privateMode;localStorage.setItem(PRIVATE_KEY,privateMode?'1':'0');applyPrivate();render(current)}
const seed=[["First Solar",2300,"Acción"],["BYD",1800,"Acción"],["Netflix",1800,"Acción"],["Meta",1900,"Acción"],["Apple",1400,"Acción"],["Palantir",1400,"Acción"],["Toyota",1300,"Acción"],["AMD",1800,"Acción"],["Nvidia",1700,"Acción"],["CaixaBank",1100,"Acción"],["S&P 500 ETF",600,"ETF"],["Amazon",598,"Acción"],["NextEra Energy",520,"Acción"],["MSCI World Acc",0,"ETF"]];
const initial={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:seed,decisions:[],contributions:[],radar:[],alerts:[],market:{lastSync:null,source:null}};
let data=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}})();data.accounts=data.accounts||initial.accounts;data.crypto=data.crypto||initial.crypto;data.assets=data.assets||structuredClone(seed);data.decisions=data.decisions||[];data.contributions=data.contributions||[];data.radar=data.radar||[];data.alerts=data.alerts||[];data.market=data.market||{};data.weekly=Number(data.weekly||300);data.target=Number(data.target||1000000);data.returnRate=Number(data.returnRate||7);
const rawMoney=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0),money=n=>privateMode?'••••••':rawMoney(n),num=n=>privateMode?'••••••':new Intl.NumberFormat('es-ES',{maximumFractionDigits:4}).format(Number(n)||0),pct=n=>privateMode?'••••••':((Number(n)||0)*100).toFixed(1)+'%',esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const assets=()=>data.assets,liq=()=>Number(data.accounts.remunerada||0)+Number(data.accounts.efectivo||0),manualInv=()=>assets().reduce((s,x)=>s+Number(x[1]||0),0);let I=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function getPos(n){const a=window.V4Portfolio?.positions||[];const aliases={Meta:'Meta Platforms',Palantir:'Palantir Technologies','S&P 500 ETF':'Vanguard S&P 500 Dist ETF','MSCI World Acc':'MSCI World Acc'};return a.find(p=>p.name.toLowerCase()===n.toLowerCase())||a.find(p=>p.name.toLowerCase()===(aliases[n]||'').toLowerCase())||null}
function total(){return I?.total??manualInv()+liq()+Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}
async function sync(){try{const m=await window.MarketV4.sync(),q=m.quotes||{},fx={USD:m.usdEur,HKD:m.hkdEur,JPY:m.jpyEur,GBP:m.gbpEur,EUR:1},aliases={'MSCI World Acc':'iShares Core MSCI World Acc','Meta':'Meta Platforms','Palantir':'Palantir Technologies','S&P 500 ETF':'Vanguard S&P 500 Dist ETF'},positions=window.V4Portfolio?.positions||[];const rows=positions.map(p=>{const qd=q[p.name]||q[aliases[p.name]],rate=fx[qd?.currency||p.currency]||1,price=Number(qd?.price),costRate=fx[p.costCurrency||p.currency]||1,costEUR=Number(p.quantity)*Number(p.averageCost)*costRate,valueEUR=Number(p.quantity)*price*rate,gainEUR=valueEUR-costEUR;return{name:p.name,quantity:p.quantity,averageCost:p.averageCost,currency:qd?.currency||p.currency,quote:Number.isFinite(price)?price:null,valueEUR:Number.isFinite(valueEUR)?valueEUR:0,costEUR,gainEUR,returnPct:costEUR?gainEUR/costEUR:0,status:Number.isFinite(price)?'live-price':'pending'}});const inv=rows.reduce((a,r)=>a+r.valueEUR,0),ethPrice=Number(m.ethPrice)||0,ethValue=Number(data.crypto.eth||0)*ethPrice;I={rows,liveInvestment:inv,total:inv+liq()+ethValue,eth:{price:ethPrice,valueEUR:ethValue}};data.crypto.ethPrice=ethPrice;data.market.lastSync=m.updatedAt?new Date(m.updatedAt).toLocaleString('es-ES'):new Date().toLocaleString('es-ES');data.market.source=m.provider||'market-data';save();render(current)}catch(e){console.error(e);render(current)}}
function refreshPrices(){const b=document.getElementById('refreshPricesBtn');if(b){b.disabled=true;b.textContent='⏳ Actualizando...'}sync().finally(()=>{if(b){b.disabled=false;b.textContent='🔄 Actualizar precios'}})}
function setPage(p){current=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));pages[p]();window.scrollTo(0,0);applyPrivate()}let current='dashboard';
const navs=[['dashboard','🏠 Inicio'],['cartera','📊 Cartera'],['liquidez','💶 Liquidez'],['crypto','Ξ Crypto'],['objetivo','🎯 Objetivo'],['riesgo','⚖️ Riesgo'],['decision','🧠 Próximo euro'],['aportaciones','💰 Aportaciones'],['alertas','🚨 Alertas'],['radar','🔎 Radar'],['historial','📝 Historial'],['config','⚙️ Config']];document.getElementById('nav').innerHTML=navs.map(x=>`<button data-p="${x[0]}" onclick="setPage('${x[0]}')">${x[1]}</button>`).join('');
function render(p=current){if(pages[p])pages[p]();applyPrivate()}
function allocation(){const t=total(),rows=[...(I?.rows||[]).map(r=>[r.name,r.valueEUR||0]),['Liquidez',liq()],['Ethereum',I?.eth?.valueEUR||Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return rows.map(x=>`<div class="row"><span><b>${esc(x[0])}</b><br><span class="muted">${money(x[1])}</span></span><span style="min-width:150px"><div class="bar"><div style="width:${Math.min(100,x[1]/Math.max(1,t)*100)}%"></div></div><span class="small">${pct(x[1]/Math.max(1,t))}</span></span></div>`).join('')}
const pages={dashboard(){const t=total(),gap=Math.max(0,data.target-t);document.getElementById('app').innerHTML=`<div class="card hero"><span class="badge">MOTOR ÚNICO</span><h2>Patrimonio total</h2><div class="kpi sensitive">${money(t)}</div><p class="muted">${pct(t/data.target)} del objetivo de ${money(data.target)}</p><div class="progress"><div style="width:${Math.min(100,t/data.target*100)}%"></div></div><p class="small">Faltan ${money(gap)}</p></div><div class="grid section"><div class="card">Inversiones<div class="kpi sensitive">${money(I?.liveInvestment??manualInv())}</div></div><div class="card">Liquidez<div class="kpi sensitive">${money(liq())}</div><span>${pct(liq()/Math.max(1,t))}</span></div><div class="card">Ethereum<div class="kpi sensitive">${money(I?.eth?.valueEUR||0)}</div><span>${num(data.crypto.eth)} ETH · ${money(I?.eth?.price||data.crypto.ethPrice||0)}/ETH</span></div><div class="card">Aportación semanal<div class="kpi sensitive">${money(data.weekly)}</div><span>${money(data.weekly*52)}/año</span></div></div><div class="card"><h3>Asignación patrimonial</h3>${allocation()}</div>`},cartera(){const rows=I?.rows||[];document.getElementById('app').innerHTML=`<h2>Cartera completa</h2><div class="card scroll"><table><thead><tr><th>Activo</th><th>Cantidad</th><th>Precio medio</th><th>Actual</th><th class="right">Valor €</th><th class="right">P/L</th><th>Estado</th></tr></thead><tbody>${assets().map(a=>{const r=rows.find(z=>z.name.toLowerCase()===a[0].toLowerCase()),p=getPos(a[0]);return `<tr><td><b>${esc(a[0])}</b><br><span class="muted">${esc(a[2])}</span></td><td>${p?num(p.quantity):'—'}</td><td>${p?num(p.averageCost)+' '+p.currency:'—'}</td><td>${r?.quote!=null?num(r.quote)+' '+r.currency:'—'}</td><td class="right"><b>${money(r?.valueEUR??a[1])}</b></td><td class="right ${r?.gainEUR>=0?'positive':'negative'}">${r?.gainEUR!=null?money(r.gainEUR)+'<br>'+pct(r.returnPct):'—'}</td><td><span class="badge ${r?.status==='live-price'?'green':r?.status==='review-quantity'?'amber':'red'}">${r?.status||'manual'}</span></td></tr>`}).join('')}</tbody></table></div>`},liquidez(){document.getElementById('app').innerHTML=`<h2>Liquidez</h2><div class="grid"><div class="card">Remunerada<div class="kpi sensitive">${money(data.accounts.remunerada)}</div></div><div class="card">Efectivo<div class="kpi sensitive">${money(data.accounts.efectivo)}</div></div><div class="card">Total<div class="kpi sensitive">${money(liq())}</div></div></div>`},crypto(){const p=I?.eth?.price||data.crypto.ethPrice||0,v=I?.eth?.valueEUR||Number(data.crypto.eth)*p;document.getElementById('app').innerHTML=`<h2>Ethereum</h2><div class="grid"><div class="card">Cantidad<div class="kpi sensitive">${num(data.crypto.eth)} ETH</div></div><div class="card">Precio<div class="kpi sensitive">${money(p)}</div></div><div class="card">Valor<div class="kpi sensitive">${money(v)}</div></div><div class="card">Peso<div class="kpi sensitive">${pct(v/Math.max(1,total()))}</div></div></div>`},objetivo(){const t=total();document.getElementById('app').innerHTML=`<h2>Objetivo máximo</h2><div class="card hero"><div class="kpi sensitive">${pct(t/data.target)}</div><p>Patrimonio ${money(t)} · objetivo ${money(data.target)}</p><p>Faltan ${money(Math.max(0,data.target-t))}</p></div>`},riesgo(){document.getElementById('app').innerHTML=`<h2>Riesgo y concentración</h2><div class="card">Análisis de concentración disponible tras sincronizar precios.</div>`},decision(){document.getElementById('app').innerHTML=`<h2>¿Dónde pongo el próximo euro?</h2><div class="card">Motor de decisión conectado al análisis de cartera.</div>`},aportaciones(){document.getElementById('app').innerHTML=`<h2>Aportaciones</h2><div class="card">Aportación semanal: <b>${money(data.weekly)}</b></div>`},alertas(){document.getElementById('app').innerHTML=`<h2>Alertas</h2><div class="card">Sin nuevas alertas.</div>`},radar(){document.getElementById('app').innerHTML=`<h2>Radar de oportunidades</h2><div class="card">Radar conectado al motor de puntuación.</div>`},historial(){document.getElementById('app').innerHTML=`<h2>Historial</h2><div class="card">Historial de decisiones y aportaciones.</div>`},config(){document.getElementById('app').innerHTML=`<h2>Configuración</h2><div class="card"><button class="action" onclick="togglePrivate()">${privateMode?'🙈 Mostrar cifras':'👁️ Activar modo privado'}</button></div>`}};
render('dashboard');setTimeout(sync,50);
</script><script src="security.js"></script></body></html>
