<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrimonio V2">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Patrimonio V2</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#2563eb;--green:#159957;--red:#d64545;--amber:#b7791f;--border:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:35px}header{background:var(--dark);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.72}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:67px;z-index:4}nav button{border:0;background:#eef2f7;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:650}nav button.active{background:var(--accent);color:#fff}main{max-width:1150px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}.hero{background:linear-gradient(135deg,#111827,#253b66);color:#fff}.hero .muted{color:#cbd5e1}.kpi{font-size:25px;font-weight:780;margin-top:6px}.muted{color:var(--muted);font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}.amber{color:var(--amber)}h2{margin:7px 0 14px}.section{margin:20px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.row:last-child{border-bottom:0}.action{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:650}.danger{background:#fff;color:var(--red);border:1px solid #f0caca}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-top:5px;background:#fff}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#185abc;font-size:12px;font-weight:650}.badge.green{background:#e9f8ef;color:#167347}.badge.red{background:#fdecec;color:#b52c2c}.badge.amber{background:#fff7df;color:#8a5a00}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);border-radius:99px}.bar{height:9px;background:#edf0f3;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);font-size:14px}.right{text-align:right}.small{font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#f7f9fc;border:1px solid var(--border)}.install{display:none;margin-top:10px}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.delete{border:0;background:transparent;color:var(--red);font-weight:700}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}main{padding:12px}}
</style></head>
<body>
<header><h1>Patrimonio V2</h1><small>Centro de control patrimonial · Objetivo: máximo patrimonio</small></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const KEY="patrimonio_v2";
const baseAssets=[["First Solar",2300,"Acción"],["BYD",1800,"Acción"],["Netflix",1800,"Acción"],["Meta",1900,"Acción"],["Apple",1400,"Acción"],["Palantir",1400,"Acción"],["Toyota",1300,"Acción"],["AMD",1800,"Acción"],["Nvidia",1700,"Acción"],["CaixaBank",1100,"Acción"],["S&P 500 ETF",600,"ETF"],["Amazon",598,"Acción"],["NextEra Energy",520,"Acción"],["MSCI World Acc",0,"ETF"]];
const defaultData={accounts:{remunerada:64480,efectivo:27000},crypto:{eth:1.1,ethPrice:0},weekly:300,target:1000000,returnRate:7,assets:baseAssets,decisions:[],contributions:[],alerts:[],radar:[]};
function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){d=null}if(!d)d=structuredClone(defaultData);if(Array.isArray(d.assets)&&d.assets.length&&Array.isArray(d.assets[0])){}else d.assets=baseAssets.map(x=>[x[0],x[1],x[2]]);d.decisions=d.decisions||[];d.contributions=d.contributions||[];d.alerts=d.alerts||[];d.radar=d.radar||[];return d}
let data=load();function save(){localStorage.setItem(KEY,JSON.stringify(data))}function assets(){return data.assets}function invested(){return assets().reduce((a,x)=>a+Number(x[1]||0),0)}function cryptoValue(){return Number(data.crypto.eth||0)*Number(data.crypto.ethPrice||0)}function liquidity(){return Number(data.accounts.remunerada||0)+Number(data.accounts.efectivo||0)}function total(){return invested()+liquidity()+cryptoValue()}function money(n){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n)||0)}function pct(n){return ((Number(n)||0)*100).toFixed(1)+"%"}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function dateNow(){return new Date().toLocaleDateString("es-ES")}function findAsset(n){return assets().find(x=>x[0].toLowerCase()===n.toLowerCase())}
function setPage(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));({dashboard,cartera,liquidez,objetivo,decisiones,radar,historial,ajustes}[p])(document.getElementById("app"))}
function decision(){const t=total(),inv=invested(),liq=liquidity(),core=findAsset("MSCI World Acc"),coreV=core?Number(core[1]):0; if(t<=0)return {label:"EMPEZAR",class:"amber",text:"Introduce el patrimonio para activar el motor."}; if(liq/t>.7)return {label:"ACUMULAR",class:"green",text:"La liquidez pesa mucho: priorizar inversión escalonada antes que aumentar efectivo, manteniendo colchón."}; if(coreV/Math.max(1,inv)<.25)return {label:"REFORZAR NÚCLEO",class:"green",text:"El núcleo global aún pesa poco: dirigir el próximo euro principalmente al MSCI World Acc."}; return {label:"MANTENER",class:"green",text:"Seguir aportación periódica al MSCI World Acc y reservar capital para oportunidades claras."}}
function dashboard(a){const t=total(),inv=invested(),liq=liquidity(),progress=Math.min(100,t/data.target*100),d=decision(),gap=Math.max(0,data.target-t);const alertCount=data.alerts.filter(x=>x.active).length;a.innerHTML=`<div class="section"><div class="card hero"><span class="badge">CONTROL PATRIMONIAL</span><h2>Patrimonio total</h2><div class="kpi">${money(t)}</div><p class="muted">Objetivo ${money(data.target)} · ${pct(t/data.target)} alcanzado</p><div class="progress"><div style="width:${progress}%"></div></div><p class="small">Faltan ${money(gap)} · ${alertCount} alerta${alertCount===1?"":"s"} activa${alertCount===1?"":"s"}</p></div></div><div class="grid"><div class="card"><div class="muted">Invertido</div><div class="kpi">${money(inv)}</div><div class="small">${pct(inv/Math.max(1,t))} del patrimonio</div></div><div class="card"><div class="muted">Liquidez</div><div class="kpi">${money(liq)}</div><div class="small">${pct(liq/Math.max(1,t))} del patrimonio</div></div><div class="card"><div class="muted">Crypto</div><div class="kpi">${data.crypto.eth} ETH</div><div class="small">${data.crypto.ethPrice?money(cryptoValue()):"Precio pendiente"}</div></div><div class="card"><div class="muted">Aportación semanal</div><div class="kpi">${money(data.weekly)}</div><div class="small">${money(data.weekly*52)} / año</div></div></div><div class="section two"><div class="card"><h3>¿Dónde pongo el próximo euro?</h3><p><b>MSCI World Acc</b></p><p class="muted">${esc(d.text)}</p><button class="action" onclick="addContribution()">Registrar aportación</button></div><div class="card"><h3>Decisión semanal</h3><span class="badge ${d.class}">${d.label}</span><p class="muted">Motor basado en estructura patrimonial introducida. No ejecuta operaciones ni sustituye datos de mercado.</p></div></div><div class="section card"><h3>Asignación patrimonial</h3>${allocationRows()}</div>`}
function allocationRows(){const t=total(),rows=[...assets().map(x=>[x[0],Number(x[1])]),["Liquidez",liquidity()],["Crypto",cryptoValue()]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return rows.slice(0,10).map(x=>`<div class="row"><span><b>${esc(x[0])}</b><br><span class="muted">${money(x[1])}</span></span><span style="min-width:120px"><div class="bar"><div style="width:${Math.min(100,x[1]/t*100)}%"></div></div><span class="small">${pct(x[1]/t)}</span></span></div>`).join("")}
function cartera(a){const totalInv=invested();a.innerHTML=`<div class="section"><h2>Cartera completa</h2><div class="card"><table><thead><tr><th>Activo</th><th>Tipo</th><th class="right">Valor</th><th class="right">Peso</th><th></th></tr></thead><tbody>${assets().map((x,i)=>`<tr><td>${esc(x[0])}</td><td>${esc(x[2]||"Activo")}</td><td class="right">${money(x[1])}</td><td class="right">${pct(Number(x[1])/Math.max(1,totalInv))}</td><td class="right"><button class="delete" onclick="removeAsset(${i})">×</button></td></tr>`).join("")}</tbody></table></div><div class="card section"><h3>Añadir / actualizar activo</h3><div class="form"><div><label>Nombre</label><input id="aname" placeholder="MSCI World Acc"></div><div><label>Valor (€)</label><input id="avalue" type="number" min="0"></div><div><label>Tipo</label><select id="atype"><option>ETF</option><option>Acción</option><option>Fondo</option><option>Otro</option></select></div></div><br><button class="action" onclick="upsertAsset()">Guardar activo</button></div></div>`}
function upsertAsset(){const n=document.getElementById("aname").value.trim(),v=Number(document.getElementById("avalue").value),type=document.getElementById("atype").value;if(!n||!Number.isFinite(v)||v<0)return;const f=findAsset(n);if(f){f[1]=v;f[2]=type}else data.assets.push([n,v,type]);save();setPage("cartera")}function removeAsset(i){if(confirm("¿Eliminar este activo?")){data.assets.splice(i,1);save();setPage("cartera")}}
function liquidez(a){a.innerHTML=`<div class="section"><h2>Liquidez</h2><div class="grid"><div class="card"><div class="muted">Cuenta remunerada</div><div class="kpi">${money(data.accounts.remunerada)}</div></div><div class="card"><div class="muted">Efectivo</div><div class="kpi">${money(data.accounts.efectivo)}</div></div><div class="card"><div class="muted">Liquidez total</div><div class="kpi">${money(liquidity())}</div></div></div><div class="card section"><h3>Control de liquidez</h3><div class="row"><span>Liquidez / patrimonio</span><b>${pct(liquidity()/Math.max(1,total()))}</b></div><div class="row"><span>Cuenta remunerada / liquidez</span><b>${pct(data.accounts.remunerada/Math.max(1,liquidity()))}</b></div><p class="muted">La app separa seguridad, liquidez y capital invertido para evitar confundir efectivo disponible con rentabilidad.</p></div></div>`}
function objetivo(a){const t=total(),gap=Math.max(0,data.target-t),annual=data.weekly*52,rate=Math.max(0,Number(data.returnRate||0))/100;let v=t,hit=null;for(let y=1;y<=50;y++){v=v*(1+rate)+annual;if(v>=data.target){hit=y;break}}a.innerHTML=`<div class="section"><h2>Objetivo patrimonial</h2><div class="card hero"><div class="muted">Progreso hacia ${money(data.target)}</div><div class="kpi">${pct(t/data.target)}</div><p>${money(gap)} para alcanzar el objetivo.</p></div><div class="grid section"><div class="card"><div class="muted">Aportación anual</div><div class="kpi">${money(annual)}</div></div><div class="card"><div class="muted">Rentabilidad usada</div><div class="kpi">${Number(data.returnRate).toFixed(1)}%</div></div><div class="card"><div class="muted">Estimación 1 M€</div><div class="kpi">${hit?hit+" años":">50 años"}</div></div></div><div class="card"><h3>Escenarios</h3>${scenarioRows(t,annual)}</div><div class="card section"><p class="muted">Proyección orientativa con rentabilidad constante y aportaciones semanales. No es una garantía ni una recomendación de inversión.</p></div></div>`}
function scenarioRows(t,annual){return [0.04,0.07,0.10].map(r=>{let v=t,y=0;while(v<data.target&&y<60){v=v*(1+r)+annual;y++}return `<div class="row"><span>${(r*100).toFixed(0)}% anual</span><b>${y<60?y+" años":">60 años"}</b></div>`}).join("")}
function decisiones(a){a.innerHTML=`<div class="section"><h2>Decisiones</h2><div class="card"><div class="form"><div><label>Activo</label><input id="dasset" placeholder="Ej. Meta"></div><div><label>Decisión</label><select id="dtype"><option>Comprar</option><option>Reforzar</option><option>Mantener</option><option>Esperar</option><option>Reducir</option></select></div><div><label>Motivo</label><input id="dreason" placeholder="Tesis / contexto"></div></div><br><button class="action" onclick="addDecision()">Guardar decisión</button></div><div class="card section">${data.decisions.length?data.decisions.map(d=>`<div class="row"><span><b>${esc(d.asset)}</b><br><span class="muted">${esc(d.reason||"")} · ${d.date}</span></span><span class="badge">${esc(d.type)}</span></div>`).join(""):"Sin decisiones registradas todavía."}</div></div>`}
function addDecision(){const asset=document.getElementById("dasset").value.trim();if(!asset)return;data.decisions.unshift({asset,type:document.getElementById("dtype").value,reason:document.getElementById("dreason").value.trim(),date:dateNow()});save();setPage("decisiones")}
function addContribution(){const amount=Number(data.weekly);data.contributions.unshift({date:dateNow(),amount,asset:"MSCI World Acc"});const f=findAsset("MSCI World Acc");if(f)f[1]=Number(f[1])+amount;else data.assets.push(["MSCI World Acc",amount,"ETF"]);save();setPage("historial")}
function historial(a){const totalC=data.contributions.reduce((s,x)=>s+Number(x.amount||0),0);a.innerHTML=`<div class="section"><h2>Historial</h2><div class="grid"><div class="card"><div class="muted">Aportado desde el registro</div><div class="kpi">${money(totalC)}</div></div><div class="card"><div class="muted">Aportaciones registradas</div><div class="kpi">${data.contributions.length}</div></div><div class="card"><div class="muted">Decisiones</div><div class="kpi">${data.decisions.length}</div></div></div><div class="card section">${data.contributions.length?data.contributions.slice(0,30).map(x=>`<div class="row"><span><b>${esc(x.asset)}</b><br><span class="muted">${x.date}</span></span><b>${money(x.amount)}</b></div>`).join(""):"<div class="empty">Aún no hay aportaciones registradas.</div>"}</div></div>`}
function radar(a){a.innerHTML=`<div class="section"><h2>Radar de oportunidades</h2><div class="card"><p class="muted">Aquí registramos oportunidades sin convertirlas automáticamente en compras. Añade precio actual, precio objetivo y una tesis para crear un sistema disciplinado.</p><div class="form"><div><label>Activo</label><input id="rasset" placeholder="Ej. Nvidia"></div><div><label>Precio actual (€)</label><input id="rprice" type="number"></div><div><label>Precio objetivo (€)</label><input id="rtarget" type="number"></div><div><label>Tesis</label><input id="rthesis" placeholder="Por qué vigilarlo"></div></div><br><button class="action" onclick="addRadar()">Añadir al radar</button></div><div class="card section">${data.radar.length?data.radar.map((r,i)=>{const upside=r.target&&r.price?(r.target/r.price-1):0;return `<div class="row"><span><b>${esc(r.asset)}</b><br><span class="muted">${esc(r.thesis||"Sin tesis")}</span></span><span class="right"><b>${upside?pct(upside):"—"}</b><br><button class="delete" onclick="removeRadar(${i})">Eliminar</button></span></div>`}).join(""):"<div class="empty">Radar vacío. La idea es esperar a que aparezca una oportunidad con tesis clara.</div>"}</div></div>`}
function addRadar(){const asset=document.getElementById("rasset").value.trim(),price=Number(document.getElementById("rprice").value),target=Number(document.getElementById("rtarget").value),thesis=document.getElementById("rthesis").value.trim();if(!asset)return;data.radar.unshift({asset,price,target,thesis,date:dateNow()});save();setPage("radar")}function removeRadar(i){data.radar.splice(i,1);save();setPage("radar")}
function ajustes(a){a.innerHTML=`<div class="section"><h2>Ajustes</h2><div class="card"><div class="form"><div><label>Cuenta remunerada (€)</label><input id="rem" type="number" value="${data.accounts.remunerada}"></div><div><label>Efectivo (€)</label><input id="cash" type="number" value="${data.accounts.efectivo}"></div><div><label>ETH</label><input id="eth" type="number" step=".01" value="${data.crypto.eth}"></div><div><label>Precio ETH (€)</label><input id="ethprice" type="number" value="${data.crypto.ethPrice||0}"></div><div><label>Aportación semanal (€)</label><input id="weekly" type="number" value="${data.weekly}"></div><div><label>Objetivo (€)</label><input id="target" type="number" value="${data.target}"></div><div><label>Rentabilidad anual estimada (%)</label><input id="rate" type="number" step="0.1" value="${data.returnRate}"></div></div><br><button class="action" onclick="updateSettings()">Guardar</button></div><div class="card section"><h3>Datos</h3><p class="muted">Los datos se guardan localmente en este dispositivo mediante localStorage. No se envían a un servidor.</p><button class="action danger" onclick="resetData()">Restablecer datos iniciales</button></div></div>`}
function updateSettings(){data.accounts.remunerada=+document.getElementById("rem").value;data.accounts.efectivo=+document.getElementById("cash").value;data.crypto.eth=+document.getElementById("eth").value;data.crypto.ethPrice=+document.getElementById("ethprice").value;data.weekly=+document.getElementById("weekly").value;data.target=+document.getElementById("target").value;data.returnRate=+document.getElementById("rate").value;save();setPage("dashboard")}function resetData(){if(confirm("¿Restablecer los datos iniciales?")){data=structuredClone(defaultData);save();setPage("dashboard")}}
const pages=[["dashboard","Dashboard"],["cartera","Cartera"],["liquidez","Liquidez"],["objetivo","Objetivo 1 M€"],["decisiones","Decisiones"],["radar","Radar"],["historial","Historial"],["ajustes","Ajustes"]];document.getElementById("nav").innerHTML=pages.map(([p,n])=>`<button data-p="${p}" onclick="setPage('${p}')">${n}</button>`).join("");if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});setPage("dashboard");
</script></body></html>
